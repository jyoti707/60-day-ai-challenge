<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0a0e17;
    --bg2:#0f1522;
    --panel:#131b2c;
    --panel2:#182238;
    --border:#232f47;
    --border-hi:#324royal;
    --accent:#4f8cff;
    --accent2:#7c5cff;
    --good:#2ecc9a;
    --warn:#ffb547;
    --bad:#ff5c72;
    --text:#e8edf7;
    --text-dim:#93a1bd;
    --text-dim2:#6b7794;
    --radius:16px;
    --shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(79,140,255,0.10), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(124,92,255,0.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 22px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    letter-spacing:0.3px;
    font-size:15px;
    color:var(--text-dim);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 12px rgba(79,140,255,0.8);
  }
  .stepper{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .step-pill{
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim2);
    font-weight:600;
    letter-spacing:0.2px;
    transition:all .25s ease;
  }
  .step-pill.active{
    color:#fff;
    background:linear-gradient(135deg, rgba(79,140,255,0.25), rgba(124,92,255,0.25));
    border-color:var(--accent);
  }
  .step-pill.done{
    color:var(--good);
    border-color:rgba(46,204,154,0.4);
  }

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover{
    border-color:var(--border-hi);
    transform:translateY(-2px);
  }
  .grid{
    display:grid;
    gap:16px;
  }
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  }

  h1,h2,h3,h4{margin:0 0 8px;font-weight:800;letter-spacing:-0.3px;}
  h1{font-size:clamp(28px,5vw,44px);}
  h2{font-size:clamp(20px,3vw,28px);}
  h3{font-size:17px;}
  p{line-height:1.6;color:var(--text-dim);margin:0 0 10px;}
  .muted{color:var(--text-dim2);}
  .small{font-size:12.5px;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 22px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:all .2s ease;
    user-select:none;
  }
  .btn:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(79,140,255,0.18);
  }
  .btn:active{transform:translateY(0);}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;
    color:#fff;
    box-shadow:0 8px 24px rgba(79,140,255,0.28);
  }
  .btn-primary:hover{
    box-shadow:0 10px 30px rgba(79,140,255,0.4);
  }
  .btn-primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .btn-block{width:100%;}
  .btn-ghost{
    background:transparent;
  }

  .badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .badge-blue{background:rgba(79,140,255,0.15);color:#8fb4ff;border:1px solid rgba(79,140,255,0.35);}
  .badge-red{background:rgba(255,92,114,0.15);color:#ff8f9e;border:1px solid rgba(255,92,114,0.35);}
  .badge-green{background:rgba(46,204,154,0.15);color:#6fe6c2;border:1px solid rgba(46,204,154,0.35);}
  .badge-orange{background:rgba(255,181,71,0.15);color:#ffcb7d;border:1px solid rgba(255,181,71,0.35);}
  .badge-purple{background:rgba(124,92,255,0.15);color:#b3a2ff;border:1px solid rgba(124,92,255,0.35);}

  .metric-label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
    color:var(--text-dim);
    font-weight:600;
  }
  .metric-value{color:var(--text);font-weight:800;}
  .bar-track{
    height:10px;
    border-radius:999px;
    background:#0c1220;
    border:1px solid var(--border);
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    transition: width 1s cubic-bezier(.22,1,.36,1);
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  .bar-fill.good{background:linear-gradient(90deg,#2ecc9a,#63e0b8);}
  .bar-fill.warn{background:linear-gradient(90deg,#ffb547,#ffd27d);}
  .bar-fill.bad{background:linear-gradient(90deg,#ff5c72,#ff8fa0);}
  .metric-block{margin-bottom:16px;}
  .metric-delta{
    font-size:12px;
    font-weight:700;
    margin-left:8px;
  }
  .delta-up{color:var(--good);}
  .delta-down{color:var(--bad);}

  .choice-card{
    background:var(--panel2);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
  }
  .choice-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(79,140,255,0.15);
  }
  .choice-card.selected{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(79,140,255,0.12), rgba(124,92,255,0.06));
    box-shadow:0 0 0 1px var(--accent) inset;
  }
  .choice-card.disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .choice-card.correct{
    border-color:var(--good);
    background:rgba(46,204,154,0.08);
  }
  .choice-card.incorrect{
    border-color:var(--bad);
    background:rgba(255,92,114,0.08);
  }
  .check{
    position:absolute;
    top:12px;right:14px;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;
  }

  .divider{
    height:1px;
    background:var(--border);
    margin:22px 0;
    border:none;
  }

  .why-box{
    background:rgba(79,140,255,0.07);
    border:1px dashed rgba(79,140,255,0.35);
    border-radius:12px;
    padding:14px 16px;
    margin-top:14px;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .why-box b{color:#9dc0ff;}

  .fade-in{
    animation: fadeIn .5s ease both;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .hero{
    text-align:center;
    padding:60px 10px 20px;
  }
  .hero .logo-mark{
    width:74px;height:74px;
    margin:0 auto 22px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
    box-shadow:0 12px 40px rgba(79,140,255,0.35);
  }
  .hero-sub{
    max-width:620px;
    margin:0 auto 30px;
    font-size:16px;
  }
  .feature-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    max-width:920px;
    margin:0 auto 34px;
  }
  @media (max-width:800px){ .feature-row{grid-template-columns:repeat(2,1fr);} }
  .feature-item{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    text-align:left;
  }
  .feature-item .ic{font-size:22px;margin-bottom:8px;}
  .feature-item h4{font-size:13.5px;margin-bottom:4px;}
  .feature-item p{font-size:12.5px;margin:0;}

  table.impact-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.impact-table td, table.impact-table th{
    padding:9px 8px;
    border-bottom:1px solid var(--border);
    text-align:left;
  }
  table.impact-table th{color:var(--text-dim2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;}

  .score-ring-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 0 20px;
  }
  .score-num{
    font-size:56px;
    font-weight:900;
    background:linear-gradient(135deg,#fff,#b9c9ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .footer-note{
    text-align:center;
    color:var(--text-dim2);
    font-size:12px;
    margin-top:50px;
  }

  .round-indicator{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .round-dot{
    flex:1;
    height:6px;
    border-radius:999px;
    background:var(--border);
    transition:background .3s ease;
  }
  .round-dot.filled{background:linear-gradient(90deg,var(--accent),var(--accent2));}

  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .kicker{
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-size:11.5px;
    font-weight:800;
    color:var(--accent);
    margin-bottom:8px;
  }

  ::selection{background:rgba(79,140,255,0.35);}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-hi,#324); border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================= DATA POOLS ============================= */

const INDUSTRIES = [
  "Consumer Electronics", "Automotive Parts", "Pharmaceuticals",
  "Apparel & Footwear", "Food & Beverage", "Home Furniture",
  "Industrial Equipment", "Medical Devices", "Toys & Games", "Renewable Energy Components"
];

const COMPANY_PREFIXES = ["Nova","Meridian","Atlas","Orbit","Vertex","Summit","Horizon","Cascade","Ironclad","Bluepeak","Solace","Granite","Northwind","Quantum","Pinehaven","Stratus","Anchor","Lumen","Fairwind","Cobalt"];
const COMPANY_SUFFIXES = ["Industries","Global","Manufacturing","Group","Corp","Supply Co.","Holdings","Logistics","Works","Dynamics"];

const COUNTRIES = ["Vietnam","China","Mexico","India","Germany","Poland","Brazil","Thailand","Bangladesh","Turkey","South Korea","Indonesia","United States","Malaysia","Taiwan"];

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max, decimals=1){ const v = Math.random() * (max-min) + min; return parseFloat(v.toFixed(decimals)); }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }
function pickMany(arr, n){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = randInt(0, copy.length-1);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function clamp(v, min=0, max=100){ return Math.max(min, Math.min(max, v)); }

function generateCompany(){
  const name = `${pick(COMPANY_PREFIXES)} ${pick(COMPANY_SUFFIXES)}`;
  const industry = pick(INDUSTRIES);
  const revenue = randInt(80, 950); // millions
  const factories = randInt(2, 9);
  const warehouses = randInt(3, 14);
  const suppliers = randInt(6, 40);
  const inventoryDays = randInt(12, 60);
  const leadTime = randInt(7, 45);
  const countries = pickMany(COUNTRIES, randInt(3,5));
  return { name, industry, revenue, factories, warehouses, suppliers, inventoryDays, leadTime, countries };
}

const CRISES = [
  {
    id:"factory_fire",
    title:"Factory Fire",
    icon:"🔥",
    urgency:"Critical",
    description:(c)=>`A fire has broken out at one of ${c.name}'s primary manufacturing facilities in ${c.countries[0]}. Production has halted completely at that site.`,
    impact:"Production capacity drops sharply, and downstream shipments will be delayed within days unless capacity is rerouted."
  },
  {
    id:"supplier_bankruptcy",
    title:"Supplier Bankruptcy",
    icon:"💸",
    urgency:"High",
    description:(c)=>`One of ${c.name}'s key raw-material suppliers, responsible for a large share of critical components, has filed for bankruptcy overnight.`,
    impact:"Component availability is at risk, and existing contracts may not be honored. Alternative sourcing is needed urgently."
  },
  {
    id:"port_strike",
    title:"Port Strike",
    icon:"🚢",
    urgency:"High",
    description:(c)=>`Dockworkers at a major export port used by ${c.name} have gone on strike, freezing outbound and inbound container traffic.`,
    impact:"Shipping lead times are ballooning and containers already at port are stranded, threatening on-time delivery commitments."
  },
  {
    id:"cyberattack",
    title:"Cyberattack on Logistics Systems",
    icon:"🛡️",
    urgency:"Critical",
    description:(c)=>`${c.name}'s warehouse management and logistics tracking systems have been hit by a ransomware attack, locking staff out of core systems.`,
    impact:"Visibility into inventory and shipments has gone dark. Orders risk being fulfilled incorrectly or not at all."
  },
  {
    id:"flood",
    title:"Regional Flooding",
    icon:"🌊",
    urgency:"High",
    description:(c)=>`Severe flooding has damaged roads and a distribution warehouse near one of ${c.name}'s key regional hubs in ${c.countries[1] || c.countries[0]}.`,
    impact:"Ground transport is disrupted and warehouse inventory may be partially damaged, risking regional stockouts."
  },
  {
    id:"raw_material_shortage",
    title:"Raw Material Shortage",
    icon:"⛏️",
    urgency:"Medium",
    description:(c)=>`A global shortage of a key raw material used across ${c.name}'s product lines has driven prices up and availability down.`,
    impact:"Production costs are rising and manufacturing may need to slow down to conserve limited material stock."
  },
  {
    id:"political_conflict",
    title:"Political Conflict / Trade Restrictions",
    icon:"⚠️",
    urgency:"Critical",
    description:(c)=>`Escalating political tension in ${c.countries[0]} has triggered new export restrictions affecting ${c.name}'s regional operations.`,
    impact:"Cross-border shipments face new tariffs and delays, and some factory operations may be temporarily suspended."
  },
  {
    id:"shipping_delay",
    title:"Global Shipping Delay",
    icon:"⏱️",
    urgency:"Medium",
    description:(c)=>`A container vessel backlog at major transshipment hubs is causing widespread delays to ${c.name}'s inbound and outbound freight.`,
    impact:"Lead times are stretching well beyond normal, threatening customer delivery promises across multiple regions."
  }
];

const URGENCY_COLOR = { "Critical":"badge-red", "High":"badge-orange", "Medium":"badge-blue" };

/* ============================= WAR ROOM DATA ============================= */

// Each action has effects on: cost, inventory, profit, deliverySpeed, satisfaction
// Positive = improves that metric, negative = hurts it (except cost, where positive = cost goes UP, which is bad)
const WAR_ROOM_ACTIONS = [
  {
    id:"air_freight",
    title:"Switch to Air Freight",
    icon:"✈️",
    desc:"Expedite critical shipments by air instead of ocean/ground to preserve delivery timelines.",
    why:"Air freight is 4-10x more expensive than ocean freight, but it can cut transit time from weeks to days — crucial when customers are waiting.",
    effects:{ cost:+18, inventory:+4, profit:-10, deliverySpeed:+22, satisfaction:+14 }
  },
  {
    id:"alt_supplier",
    title:"Activate Backup Supplier",
    icon:"🔄",
    desc:"Engage a pre-vetted secondary supplier to fill the gap left by the disrupted source.",
    why:"Diversified sourcing is a core resilience strategy, but backup suppliers often charge a premium and may need ramp-up time.",
    effects:{ cost:+10, inventory:+12, profit:-4, deliverySpeed:+8, satisfaction:+6 }
  },
  {
    id:"draw_down_inventory",
    title:"Draw Down Safety Stock",
    icon:"📦",
    desc:"Use existing warehouse buffer inventory to keep fulfilling orders while the issue is resolved.",
    why:"This buys time without new spending, but it depletes your safety net — if the crisis drags on, you could run out completely.",
    effects:{ cost:-4, inventory:-20, profit:+6, deliverySpeed:+10, satisfaction:+8 }
  },
  {
    id:"customer_comms",
    title:"Proactive Customer Communication",
    icon:"📣",
    desc:"Get ahead of the issue with transparent updates to customers about delays and mitigation steps.",
    why:"Transparency rarely fixes the underlying supply problem, but it consistently protects customer trust and reduces complaint volume.",
    effects:{ cost:+2, inventory:0, profit:-1, deliverySpeed:0, satisfaction:+16 }
  },
  {
    id:"reroute_logistics",
    title:"Reroute Logistics Network",
    icon:"🗺️",
    desc:"Redirect shipments through alternate ports, warehouses, or transport modes to bypass the disruption.",
    why:"Rerouting adds complexity and coordination cost, but it can route around the specific chokepoint causing the crisis.",
    effects:{ cost:+8, inventory:+2, profit:-3, deliverySpeed:+16, satisfaction:+9 }
  },
  {
    id:"price_hold",
    title:"Absorb Costs, Hold Prices",
    icon:"🛡️",
    desc:"Keep customer-facing prices unchanged and absorb the extra crisis-response costs internally.",
    why:"This protects customer loyalty and market share, but it directly compresses your profit margin during an already costly period.",
    effects:{ cost:+6, inventory:0, profit:-14, deliverySpeed:0, satisfaction:+10 }
  },
  {
    id:"overtime_production",
    title:"Authorize Overtime Production",
    icon:"🏭",
    desc:"Pay factory staff overtime to maximize output at unaffected facilities and offset lost capacity.",
    why:"This can quickly recover lost volume, but overtime labor is expensive and can strain workers if sustained too long.",
    effects:{ cost:+12, inventory:+10, profit:-6, deliverySpeed:+6, satisfaction:+3 }
  },
  {
    id:"renegotiate_contracts",
    title:"Renegotiate Supplier Contracts",
    icon:"📝",
    desc:"Reopen terms with unaffected suppliers to secure priority allocation and better pricing.",
    why:"This can reduce cost pressure and secure supply, but it takes time and goodwill you may not have much of in a fast-moving crisis.",
    effects:{ cost:-8, inventory:+6, profit:+8, deliverySpeed:+2, satisfaction:+2 }
  }
];

/* ============================= NEGOTIATION DATA ============================= */

const NEGOTIATION_ROUNDS = [
  {
    id:1,
    prompt:(sup)=>`${sup.name} opens the call by acknowledging the disruption but stating their raw material costs have risen 15%. They propose a price increase to offset it. How do you respond?`,
    options:[
      { id:"a", label:"Accept the increase immediately to keep the relationship smooth.",
        effects:{ trust:+8, price:+15, leadTime:0 },
        why:"Accepting quickly builds goodwill fast, but you pay the full cost increase with no pushback." },
      { id:"b", label:"Ask for supporting cost data before agreeing to anything.",
        effects:{ trust:+4, price:+9, leadTime:0 },
        why:"Requesting evidence is professional and often earns a partial concession, while still preserving trust." },
      { id:"c", label:"Push back hard and threaten to move volume elsewhere.",
        effects:{ trust:-10, price:+4, leadTime:+3 },
        why:"Aggressive pressure can reduce the price increase, but it damages trust and may slow down responsiveness later." },
      { id:"d", label:"Propose splitting the increase 50/50 as a partnership gesture.",
        effects:{ trust:+10, price:+7, leadTime:0 },
        why:"A fair compromise often builds the strongest long-term trust while still limiting your cost exposure." }
    ]
  },
  {
    id:2,
    prompt:(sup)=>`${sup.name} says they can guarantee your original lead time only if you commit to a 6-month minimum volume contract. Do you commit?`,
    options:[
      { id:"a", label:"Sign the 6-month commitment to lock in speed.",
        effects:{ trust:+6, price:0, leadTime:-8 },
        why:"Locking in volume reassures the supplier and often earns faster, more reliable service — at the cost of flexibility." },
      { id:"b", label:"Offer a 3-month trial commitment instead.",
        effects:{ trust:+5, price:+2, leadTime:-4 },
        why:"A shorter commitment reduces your risk while still signaling good faith, though the supplier may not offer full priority." },
      { id:"c", label:"Decline any commitment and ask for standard terms.",
        effects:{ trust:-4, price:+5, leadTime:+6 },
        why:"Staying flexible protects you if the crisis resolves quickly, but you lose leverage on speed and price." },
      { id:"d", label:"Counter with a performance-based contract tied to their delivery accuracy.",
        effects:{ trust:+9, price:-2, leadTime:-6 },
        why:"Performance-based terms align incentives well and often produce the best outcomes — but require more negotiation skill to land." }
    ]
  },
  {
    id:3,
    prompt:(sup)=>`Mid-negotiation, ${sup.name} reveals they're also being courted by one of your competitors for exclusive supply. How do you handle it?`,
    options:[
      { id:"a", label:"Match whatever terms the competitor is rumored to be offering.",
        effects:{ trust:+3, price:+10, leadTime:-3 },
        why:"Matching aggressively secures supply but can be costly if the rumored offer was exaggerated as a negotiating tactic." },
      { id:"b", label:"Emphasize your long payment history and reliability as a partner.",
        effects:{ trust:+11, price:-3, leadTime:-2 },
        why:"Relationship equity is a powerful lever — reliable partners often get preferential treatment without paying a premium." },
      { id:"c", label:"Call their bluff and continue negotiating at current terms.",
        effects:{ trust:-6, price:0, leadTime:+4 },

/* ============================= SMALL UI COMPONENTS ============================= */

function Badge({children, type="blue"}){
  return <span className={`badge badge-${type}`}>{children}</span>;
}

function ProgressBar({label, value, displayValue, tone, deltaText, deltaUp}){
  const [width, setWidth] = useState(0);
  useEffect(()=>{
    const t = setTimeout(()=> setWidth(clamp(value)), 80);
    return ()=> clearTimeout(t);
  },[value]);
  const toneClass = tone || (value >= 65 ? "good" : value <= 35 ? "bad" : "warn");
  return (
    <div className="metric-block">
      <div className="metric-label">
        <span>{label}</span>
        <span>
          <span className="metric-value">{displayValue !== undefined ? displayValue : Math.round(value)}</span>
          {deltaText ? <span className={`metric-delta ${deltaUp ? "delta-up":"delta-down"}`}>{deltaText}</span> : null}
        </span>
      </div>
      <div className="bar-track">
        <div className={`bar-fill ${toneClass}`} style={{width: width+"%"}}></div>
      </div>
    </div>
  );
}

function StepHeader({kicker, title, subtitle}){
  return (
    <div className="fade-in" style={{marginBottom:22}}>
      <div className="kicker">{kicker}</div>
      <h2>{title}</h2>

const STEP_LABELS = ["Welcome","Company","Crisis","War Room","Negotiation","Boardroom","AI Strategy","Dashboard"];

  );
}

/* ---------- WAR ROOM ---------- */

function WarRoom({company, crisis, onComplete}){
  const [selected, setSelected] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [metrics, setMetrics] = useState({ cost:40, inventory:60, profit:55, deliverySpeed:50, satisfaction:55 });
  const [startMetrics] = useState({ cost:40, inventory:60, profit:55, deliverySpeed:50, satisfaction:55 });

  const toggle = (id) => {
    if(submitted) return;
    setSelected(prev=>{
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length >= 3) return prev;
      return [...prev, id];
    });
  };

  const simulate = () => {
    if(selected.length !== 3) return;
    let next = {...startMetrics};
    selected.forEach(id=>{
      const action = WAR_ROOM_ACTIONS.find(a=>a.id===id);
      next.cost = clamp(next.cost + action.effects.cost);
      next.inventory = clamp(next.inventory + action.effects.inventory);
      next.profit = clamp(next.profit + action.effects.profit);
      next.deliverySpeed = clamp(next.deliverySpeed + action.effects.deliverySpeed);
      next.satisfaction = clamp(next.satisfaction + action.effects.satisfaction);
    });
    setMetrics(next);
    setSubmitted(true);
  };

  const costControlScore = clamp(100 - metrics.cost);
  const resilienceScore = Math.round((metrics.inventory + metrics.deliverySpeed)/2);

  return (
    <div className="fade-in">
      <StepHeader
        kicker="Step 3 of 7 · War Room"
        title="Choose Your Response"
        subtitle={`Pick exactly 3 of the 6 available actions below to respond to the ${crisis.title.toLowerCase()}. Each action trades off differently across cost, inventory, profit, delivery speed, and customer satisfaction — there's no single "correct" combo, only trade-offs.`}
      />

      <div className="grid grid-3">
        {WAR_ROOM_ACTIONS.slice(0,6).map(action=>{
          const isSelected = selected.includes(action.id);
          let cls = "choice-card";
          if(isSelected) cls += " selected";
          if(submitted) cls += " disabled";
          return (
            <div key={action.id} className={cls} onClick={()=>toggle(action.id)}>
              {isSelected && <div className="check">✓</div>}
              <div style={{fontSize:26, marginBottom:8}}>{action.icon}</div>
              <h4>{action.title}</h4>
              <p className="small">{action.desc}</p>
              <div className="why-box small" style={{marginTop:10, padding:"10px 12px"}}>
                <b>Why it matters:</b> {action.why}
              </div>
            </div>
          );
        })}
      </div>

      <div className="flex-between" style={{marginTop:18}}>
        <p className="small muted">Selected {selected.length} / 3</p>
        {!submitted && (
          <button className="btn btn-primary" disabled={selected.length!==3} onClick={simulate}>
            Simulate Response →
          </button>
        )}
      </div>

      {submitted && (
        <div className="card fade-in" style={{marginTop:24}}>
          <h3>📊 Simulated Outcome</h3>
          <p className="small">Here's how your three chosen actions played out across the company's key operating metrics.</p>
          <div className="grid grid-2" style={{marginTop:14}}>
            <div>
              <ProgressBar label="Cost Pressure" value={metrics.cost} tone={metrics.cost>60?"bad":metrics.cost>40?"warn":"good"} />
              <ProgressBar label="Inventory Health" value={metrics.inventory} />
              <ProgressBar label="Profit Margin" value={metrics.profit} />
            </div>
            <div>
              <ProgressBar label="Delivery Speed" value={metrics.deliverySpeed} />
              <ProgressBar label="Customer Satisfaction" value={metrics.satisfaction} />
            </div>
          </div>
          <div className="why-box">
            <b>Reading this:</b> Cost Pressure is the one metric where <i>lower is better</i> — it reflects how much extra
            spend your crisis response required. Everything else is better when higher.
          </div>
          <div style={{textAlign:"right", marginTop:18}}>
            <button className="btn btn-primary" onClick={()=>onComplete({ metrics, selectedActions:selected, costControlScore, resilienceScore })}>
              Continue to Negotiation →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- NEGOTIATION ---------- */

function Negotiation({supplier, onComplete}){
  const [round, setRound] = useState(0);
  const [state, setState] = useState({ trust:50, price:50, leadTime:50 });
  const [history, setHistory] = useState([]);
  const [selectedOption, setSelectedOption] = useState(null);
  const [showResult, setShowResult] = useState(false);

  const currentRound = NEGOTIATION_ROUNDS[round];

  const choose = (opt) => {
    if(showResult) return;
    setSelectedOption(opt);
    setShowResult(true);
  };

  const next = () => {
    const opt = selectedOption;
    const newState = {
      trust: clamp(state.trust + opt.effects.trust),
      price: clamp(state.price + opt.effects.price),
      leadTime: clamp(state.leadTime + opt.effects.leadTime)
    };
    const newHistory = [...history, { round: round+1, choice: opt.label, why: opt.why }];
    setState(newState);
    setHistory(newHistory);
    setSelectedOption(null);
    setShowResult(false);

    if(round + 1 >= NEGOTIATION_ROUNDS.length){
      const negotiationScore = Math.round((newState.trust*0.4) + ((100-newState.price)*0.35) + ((100-newState.leadTime)*0.25));
      onComplete({ finalState:newState, history:newHistory, negotiationScore });
    } else {
      setRound(round+1);
    }
  };

  return (
    <div className="fade-in">
      <StepHeader
        kicker="Step 4 of 7 · Negotiation"
        title={`Supplier Negotiation: ${supplier.name}`}
        subtitle="Four rounds. Each choice shifts Trust, Price, and Lead Time. Trust affects how flexible the supplier is willing to be in future rounds and in real life, future dealings. Watch how your choices compound."
      />

      <div className="round-indicator">
        {NEGOTIATION_ROUNDS.map((r,i)=>(
          <div key={i} className={`round-dot ${i<=round ? "filled":""}`}></div>
        ))}
      </div>

      <div className="grid grid-3" style={{marginBottom:20}}>
        <div className="card" style={{padding:16}}>
          <ProgressBar label="Trust" value={state.trust} />
        </div>
        <div className="card" style={{padding:16}}>
          <ProgressBar label="Price Level" value={state.price} tone={state.price>60?"bad":state.price>40?"warn":"good"} />
        </div>
        <div className="card" style={{padding:16}}>
          <ProgressBar label="Lead Time Pressure" value={state.leadTime} tone={state.leadTime>60?"bad":state.leadTime>40?"warn":"good"} />
        </div>
      </div>

      <div className="card">
        <div className="kicker">Round {round+1} of {NEGOTIATION_ROUNDS.length}</div>
        <h3>{currentRound.prompt(supplier)}</h3>
        <div className="grid grid-2" style={{marginTop:16}}>
          {currentRound.options.map(opt=>{
            let cls = "choice-card";
            const isSel = selectedOption && selectedOption.id===opt.id;
            if(isSel) cls += " selected";
            if(showResult && !isSel) cls += " disabled";
            return (
              <div key={opt.id} className={cls} onClick={()=>choose(opt)}>
                {isSel && <div className="check">✓</div>}
                <p style={{color:"var(--text)", marginBottom:0}}>{opt.label}</p>
              </div>
            );
          })}
        </div>

        {showResult && (
          <div className="why-box fade-in" style={{marginTop:16}}>
            <b>What happened:</b> {selectedOption.why}
            <div style={{marginTop:8}}>
              Trust {selectedOption.effects.trust>=0? "+":""}{selectedOption.effects.trust} ·
              {" "}Price {selectedOption.effects.price>=0? "+":""}{selectedOption.effects.price} ·
              {" "}Lead Time Pressure {selectedOption.effects.leadTime>=0? "+":""}{selectedOption.effects.leadTime}
            </div>
          </div>
        )}

        {showResult && (
          <div style={{textAlign:"right", marginTop:16}}>
            <button className="btn btn-primary" onClick={next}>
              {round+1 >= NEGOTIATION_ROUNDS.length ? "Finish Negotiation →" : "Next Round →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- CEO BOARDROOM ---------- */

function Boardroom({onComplete}){
  const [qIndex, setQIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [totalScore, setTotalScore] = useState(0);
  const [log, setLog] = useState([]);

  const question = BOARDROOM_QUESTIONS[qIndex];

  const choose = (opt) => {
    if(showResult) return;
    setSelected(opt);
    setShowResult(true);
  };

  const next = () => {
    const newTotal = totalScore + selected.score;
    const newLog = [...log, { q: question.q, choice: selected.label, score: selected.score, why: selected.why }];
    setTotalScore(newTotal);
    setLog(newLog);
    setSelected(null);
    setShowResult(false);
    if(qIndex + 1 >= BOARDROOM_QUESTIONS.length){
      const leadershipScore = Math.round((newTotal / (BOARDROOM_QUESTIONS.length*10)) * 100);
      onComplete({ leadershipScore, log:newLog });
    } else {
      setQIndex(qIndex+1);
    }
  };

  return (
    <div className="fade-in">
      <StepHeader
        kicker="Step 5 of 7 · CEO Boardroom"
        title="Executive Leadership Questions"
        subtitle="You're now in front of the board. These five questions test your judgment as a leader during crisis, not just your operational plan. Choose the response that reflects the strongest leadership instinct."
      />

      <div className="round-indicator">
        {BOARDROOM_QUESTIONS.map((r,i)=>(
          <div key={i} className={`round-dot ${i<=qIndex ? "filled":""}`}></div>
        ))}
      </div>

      <div className="card">
        <div className="kicker">Question {qIndex+1} of {BOARDROOM_QUESTIONS.length}</div>
        <h3>{question.q}</h3>
        <div className="grid grid-2" style={{marginTop:16}}>
          {question.options.map((opt,i)=>{
            let cls = "choice-card";
            const isSel = selected===opt;
            if(isSel) cls += " selected";
            if(showResult && !isSel) cls += " disabled";
            if(showResult && isSel && opt.score>=8) cls += " correct";
            if(showResult && isSel && opt.score<=3) cls += " incorrect";
            return (
              <div key={i} className={cls} onClick={()=>choose(opt)}>
                {isSel && <div className="check">✓</div>}
                <p style={{color:"var(--text)", marginBottom:0}}>{opt.label}</p>
              </div>
            );
          })}
        </div>
        {showResult && (
          <div className="why-box fade-in" style={{marginTop:16}}>
            <b>Executive insight:</b> {selected.why}
          </div>
        )}
        {showResult && (
          <div style={{textAlign:"right", marginTop:16}}>
            <button className="btn btn-primary" onClick={next}>
              {qIndex+1 >= BOARDROOM_QUESTIONS.length ? "Continue to AI Strategy →" : "Next Question →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- AI STRATEGY ---------- */

function AiStrategy({onComplete}){
  const [selected, setSelected] = useState([]);
  const [submitted, setSubmitted] = useState(false);

  const toggle = (id) => {
    if(submitted) return;
    setSelected(prev=>{
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length>=2) return prev;
      return [...prev, id];
    });
  };

  const submit = () => {
    if(selected.length!==2) return;
    setSubmitted(true);
  };

  const chosen = AI_INVESTMENTS.filter(a=>selected.includes(a.id));
  const totalResilience = chosen.reduce((s,a)=>s+a.stats.resilience,0);
  const totalCost = chosen.reduce((s,a)=>s+a.stats.cost,0);
  const totalSat = chosen.reduce((s,a)=>s+a.stats.satisfaction,0);

  return (
    <div className="fade-in">
      <StepHeader
        kicker="Step 6 of 7 · AI Strategy"
        title="Invest in Future Resilience"
        subtitle="Pick exactly 2 AI investments to fund for next year. Think about what would have helped most with the crisis you just faced — and what will help most with whatever comes next."
      />

      <div className="grid grid-3">
        {AI_INVESTMENTS.map(inv=>{
          const isSel = selected.includes(inv.id);
          let cls = "choice-card";
          if(isSel) cls += " selected";
          if(submitted) cls += " disabled";
          return (
            <div key={inv.id} className={cls} onClick={()=>toggle(inv.id)}>
              {isSel && <div className="check">✓</div>}
              <div style={{fontSize:26, marginBottom:8}}>{inv.icon}</div>
              <h4>{inv.title}</h4>
              <p className="small">{inv.desc}</p>
              <div className="why-box small" style={{marginTop:10, padding:"10px 12px"}}>
                <b>Expected impact:</b> {inv.impact}
              </div>
            </div>
          );
        })}
      </div>

      <div className="flex-between" style={{marginTop:18}}>
        <p className="small muted">Selected {selected.length} / 2</p>
        {!submitted && (
          <button className="btn btn-primary" disabled={selected.length!==2} onClick={submit}>
            Confirm Investment →
          </button>
        )}
      </div>

      {submitted && (
        <div className="card fade-in" style={{marginTop:24}}>
          <h3>🧭 Projected Impact of Your AI Strategy</h3>
          <table className="impact-table">
            <thead>
              <tr><th>Investment</th><th>Resilience</th><th>Cost Impact</th><th>Satisfaction</th></tr>
            </thead>
            <tbody>
              {chosen.map(c=>(
                <tr key={c.id}>
                  <td>{c.icon} {c.title}</td>
                  <td style={{color:"var(--good)"}}>+{c.stats.resilience}</td>
                  <td style={{color: c.stats.cost<0 ? "var(--good)":"var(--bad)"}}>{c.stats.cost}</td>
                  <td style={{color:"var(--good)"}}>+{c.stats.satisfaction}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="why-box">
            <b>Why this combination matters:</b> Together, these investments give you an estimated <b>+{totalResilience}</b> resilience,
            an operating cost change of <b>{totalCost}</b>, and a projected satisfaction lift of <b>+{totalSat}</b> over the following year.
          </div>
          <div style={{textAlign:"right", marginTop:18}}>
            <button className="btn btn-primary" onClick={()=>onComplete({ chosen, totalResilience, totalCost, totalSat })}>
              See Final Dashboard →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- FINAL DASHBOARD ---------- */

function FinalDashboard({company, crisis, warRoom, negotiation, boardroom, aiStrategy, onReplay}){

  // Derive component scores 0-100
  const leadership = boardroom.leadershipScore;
  const negotiationScore = negotiation.negotiationScore;
  const resilience = clamp(Math.round((warRoom.resilienceScore*0.5) + (aiStrategy.totalResilience*2.5)));
  const costControl = clamp(warRoom.costControlScore + Math.round(aiStrategy.totalCost * -1.2));
  const riskManagement = clamp(Math.round((negotiation.finalState.trust*0.4) + (resilience*0.4) + (leadership*0.2)));
  const customerSatisfaction = clamp(Math.round((warRoom.metrics.satisfaction*0.6) + (aiStrategy.totalSat*2.5)));

  const overall = Math.round(
    (leadership*0.2) + (negotiationScore*0.2) + (resilience*0.15) +
    (costControl*0.15) + (riskManagement*0.15) + (customerSatisfaction*0.15)
  );

  let grade, gradeColor;
  if(overall>=85){ grade="Exceptional Crisis Leadership"; gradeColor="good"; }
  else if(overall>=70){ grade="Strong Performance"; gradeColor="good"; }
  else if(overall>=55){ grade="Solid, With Room to Grow"; gradeColor="warn"; }
  else if(overall>=40){ grade="Rocky but Recoverable"; gradeColor="warn"; }
  else { grade="Crisis Poorly Contained"; gradeColor="bad"; }

  // Determine biggest mistake & best decision heuristically
  const allWarActions = warRoom.selectedActions.map(id=>WAR_ROOM_ACTIONS.find(a=>a.id===id));
  const worstWarAction = [...allWarActions].sort((a,b)=> (a.effects.profit - b.effects.cost) - (b.effects.profit - a.effects.cost))[0];
  const bestWarAction = [...allWarActions].sort((a,b)=> (b.effects.deliverySpeed + b.effects.satisfaction) - (a.effects.deliverySpeed + a.effects.satisfaction))[0];

  const worstBoardroomChoice = [...boardroom.log].sort((a,b)=>a.score-b.score)[0];
  const bestBoardroomChoice = [...boardroom.log].sort((a,b)=>b.score-a.score)[0];

  const biggestMistake = worstBoardroomChoice.score <= 3
    ? `In the boardroom, choosing "${worstBoardroomChoice.choice}" was the weakest leadership move — ${worstBoardroomChoice.why}`
    : `Selecting "${worstWarAction.title}" as a war room action came with a real cost trade-off that stretched your budget more than it needed to.`;

  const bestDecision = bestBoardroomChoice.score >= 8
    ? `In the boardroom, choosing "${bestBoardroomChoice.choice}" was a standout leadership call — ${bestBoardroomChoice.why}`
    : `Choosing "${bestWarAction.title}" in the War Room gave you strong delivery and satisfaction gains without excessive cost.`;

  let expertRecommendation;
  if(costControl < 45){
    expertRecommendation = "Your cost control came under real pressure this crisis. Next time, weigh cheaper mitigation options (like drawing down safety stock or renegotiating contracts) before reaching for expensive levers like air freight.";
  } else if(resilience < 45){
    expertRecommendation = "Resilience was your weakest area. Prioritize supplier diversification and monitoring investments so future disruptions are caught earlier and hurt less.";
  } else if(negotiationScore < 50){
    expertRecommendation = "Your supplier negotiation left value on the table. Building trust early in a negotiation typically pays off more than aggressive pressure tactics.";
  } else if(customerSatisfaction < 50){
    expertRecommendation = "Customers felt this crisis more than they needed to. Proactive communication is one of the cheapest, highest-leverage moves available during any disruption.";
  } else {
    expertRecommendation = "You handled this crisis with strong balance across cost, speed, and relationships. The next challenge is turning this into a repeatable playbook so your team responds just as well without you in the room.";
  }

  const lessons = [
    "Inventory buffers buy you time, but they're a finite resource — pair them with faster structural fixes.",
    "Trust built with suppliers before a crisis pays dividends when you need flexibility most.",
    "Transparent communication is one of the few moves that helps customer satisfaction with almost no downside.",
    "AI investments in monitoring and forecasting reduce how often you're caught by surprise in the first place.",
    "Executive decisiveness under uncertainty is judged less on being 'right' and more on being clear and timely."
  ];
  const pickedLessons = pickMany(lessons, 3);

  return (
    <div className="fade-in">
      <StepHeader
        kicker="Step 7 of 7 · Final Report"
        title="Crisis Debrief"
        subtitle={`Here's how you performed leading ${company.name} through the ${crisis.title.toLowerCase()}.`}
      />

      <div className="card" style={{textAlign:"center"}}>
        <div className="score-ring-wrap">
          <div className="kicker">Overall Crisis Score</div>
          <div className="score-num">{overall}</div>
          <Badge type={gradeColor}>{grade}</Badge>
        </div>
      </div>

      <div className="grid grid-3" style={{marginTop:20}}>
        <div className="card">
          <ProgressBar label="Leadership" value={leadership} />
          <ProgressBar label="Negotiation" value={negotiationScore} />
        </div>
        <div className="card">
          <ProgressBar label="Resilience" value={resilience} />
          <ProgressBar label="Cost Control" value={costControl} />
        </div>
        <div className="card">
          <ProgressBar label="Risk Management" value={riskManagement} />
          <ProgressBar label="Customer Satisfaction" value={customerSatisfaction} />
        </div>
      </div>

      <div className="grid grid-2" style={{marginTop:20}}>
        <div className="card">
          <div className="kicker" style={{color:"var(--bad)"}}>⚠️ Biggest Mistake</div>
          <p style={{color:"var(--text)"}}>{biggestMistake}</p>
        </div>
        <div className="card">
          <div className="kicker" style={{color:"var(--good)"}}>✅ Best Decision</div>
          <p style={{color:"var(--text)"}}>{bestDecision}</p>
        </div>
      </div>

      <div className="card" style={{marginTop:20}}>
        <div className="kicker">🎓 Expert Recommendation</div>
        <p style={{color:"var(--text)"}}>{expertRecommendation}</p>
      </div>

      <div className="card" style={{marginTop:20}}>
        <div className="kicker">📚 Lessons Learned</div>
        <ul style={{margin:0, paddingLeft:20, color:"var(--text-dim)"}}>
          {pickedLessons.map((l,i)=>(<li key={i} style={{marginBottom:8}}>{l}</li>))}
        </ul>
      </div>

      <div className="tag-row" style={{justifyContent:"center", marginTop:24}}>
        <Badge type="blue">{company.industry}</Badge>
        <Badge type="orange">{crisis.title}</Badge>
        <Badge type="purple">{aiStrategy.chosen.map(c=>c.title).join(" + ")}</Badge>
      </div>

      <div style={{textAlign:"center", marginTop:30}}>
        <button className="btn btn-primary" style={{padding:"15px 34px", fontSize:15.5}} onClick={onReplay}>
          🔁 Replay With a New Company &amp; Crisis
        </button>
      </div>
      <div className="footer-note">Operation Lifeline is a fictional training simulation. All companies, suppliers, and events are randomly generated.</div>
    </div>
  );
}

/* ============================= APP ROOT ============================= */

function App(){
  const [screen, setScreen] = useState("welcome");
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [supplier, setSupplier] = useState(null);

  const [warRoomResult, setWarRoomResult] = useState(null);
  const [negotiationResult, setNegotiationResult] = useState(null);
  const [boardroomResult, setBoardroomResult] = useState(null);
  const [aiStrategyResult, setAiStrategyResult] = useState(null);

  const stepIndexMap = {
    welcome:0, company:1, crisis:2, warroom:3, negotiation:4, boardroom:5, aistrategy:6, dashboard:7
  };

  const startSimulation = () => {
    setCompany(generateCompany());
    setCrisis(pick(CRISES));
    setSupplier({ name: pick(SUPPLIER_NAMES) });
    setScreen("company");
  };

  const resetAll = () => {
    setWarRoomResult(null);
    setNegotiationResult(null);
    setBoardroomResult(null);
    setAiStrategyResult(null);
    startSimulation();
  };

  let content = null;
  if(screen === "welcome"){
    content = <Welcome onStart={startSimulation} />;
  } else if(screen === "company"){
    content = <CompanyScreen company={company} onContinue={()=>setScreen("crisis")} />;
  } else if(screen === "crisis"){
    content = <CrisisScreen company={company} crisis={crisis} onContinue={()=>setScreen("warroom")} />;
  } else if(screen === "warroom"){
    content = <WarRoom company={company} crisis={crisis} onComplete={(res)=>{ setWarRoomResult(res); setScreen("negotiation"); }} />;
  } else if(screen === "negotiation"){
    content = <Negotiation supplier={supplier} onComplete={(res)=>{ setNegotiationResult(res); setScreen("boardroom"); }} />;
  } else if(screen === "boardroom"){
    content = <Boardroom onComplete={(res)=>{ setBoardroomResult(res); setScreen("aistrategy"); }} />;
  } else if(screen === "aistrategy"){
    content = <AiStrategy onComplete={(res)=>{ setAiStrategyResult(res); setScreen("dashboard"); }} />;
  } else if(screen === "dashboard"){
    content = (
      <FinalDashboard
        company={company}
        crisis={crisis}
        warRoom={warRoomResult}
        negotiation={negotiationResult}
        boardroom={boardroomResult}
        aiStrategy={aiStrategyResult}
        onReplay={resetAll}
      />
    );
  }

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand"><span className="dot"></span> OPERATION LIFELINE</div>
        {screen !== "welcome" && <Stepper stepIndex={stepIndexMap[screen]} />}
      </div>
      {content}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
