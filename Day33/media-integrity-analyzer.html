<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Integrity Analyzer</title>
<style>
  :root{
    --bg-0:#07110d;
    --bg-1:#0c1a14;
    --bg-2:#11241b;
    --card:#0f2019;
    --card-hover:#152c21;
    --border:#1e3a2c;
    --border-hover:#2f5c44;
    --emerald:#10b981;
    --emerald-bright:#34e0a1;
    --emerald-dim:#0d7a5a;
    --gold:#e6c88a;
    --red:#ef5350;
    --amber:#f0a93a;
    --text-0:#eef7f1;
    --text-1:#b9ccc0;
    --text-2:#7d9689;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 10% -10%, rgba(16,185,129,.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(52,224,161,.06), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    color:var(--text-0);
    font-family: "Iowan Old Style","Georgia","Times New Roman",serif;
    min-height:100vh;
    line-height:1.55;
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  ::selection{background:rgba(16,185,129,.35);}
  a{color:var(--emerald-bright);}

  .wrap{max-width:980px;margin:0 auto;padding:36px 20px 90px;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:34px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--emerald),var(--emerald-dim));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(16,185,129,.35);
    font-weight:700;color:#03130b;font-size:18px;font-family:var(--sans);
  }
  .brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px;font-family:inherit;}
  .brand .tag{font-size:12px;color:var(--text-2);font-family:var(--sans);letter-spacing:.4px;text-transform:uppercase;}

  .stagepill{
    font-family:var(--sans);font-size:12px;color:var(--text-1);
    border:1px solid var(--border);padding:6px 12px;border-radius:100px;
    background:rgba(16,185,129,.05);
  }

  /* Progress */
  .progress-track{
    height:6px;border-radius:100px;background:var(--bg-2);
    overflow:hidden;border:1px solid var(--border);margin-bottom:40px;
  }
  .progress-fill{
    height:100%;border-radius:100px;
    background:linear-gradient(90deg,var(--emerald-dim),var(--emerald-bright));
    width:0%;transition:width .6s cubic-bezier(.65,0,.35,1);
    box-shadow:0 0 12px rgba(52,224,161,.6);
  }

  /* Metrics dashboard mini */
  .metrics{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:38px;
  }
  .metric{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px 14px 12px;font-family:var(--sans);
    transition:.3s ease;
  }
  .metric:hover{border-color:var(--border-hover);transform:translateY(-2px);}
  .metric .m-label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .metric .m-value{font-size:22px;font-weight:700;color:var(--text-0);margin-bottom:8px;}
  .m-bar-track{height:5px;border-radius:100px;background:var(--bg-2);overflow:hidden;}
  .m-bar-fill{height:100%;border-radius:100px;transition:width .8s cubic-bezier(.65,0,.35,1);}

  /* Cards / sections */
  .card{
    background:linear-gradient(180deg,var(--card),rgba(15,32,25,.7));
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px;
    margin-bottom:26px;
    box-shadow:var(--shadow);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .eyebrow{
    font-family:var(--sans);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--emerald-bright);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"";width:16px;height:1px;background:var(--emerald-bright);display:inline-block;}

  h2.section-title{
    font-size:28px;margin:0 0 14px;font-weight:600;line-height:1.25;
  }
  p.lead{color:var(--text-1);font-size:16px;margin:0 0 6px;}

  .concept-box{
    background:rgba(16,185,129,.06);
    border:1px solid var(--border);
    border-left:3px solid var(--emerald);
    border-radius:12px;
    padding:18px 20px;
    margin:20px 0 8px;
    font-size:15px;
    color:var(--text-1);
  }
  .concept-box b{color:var(--text-0);}

  /* Article mock */
  .article-mock{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:26px 28px;
    margin:22px 0;
    position:relative;
    overflow:hidden;
  }
  .article-mock::before{
    content:"SIMULATED CONTENT";
    position:absolute;top:12px;right:16px;
    font-family:var(--sans);font-size:10px;letter-spacing:1px;
    color:var(--text-2);opacity:.6;
  }
  .article-mock .site{
    font-family:var(--sans);font-size:11px;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;
  }
  .article-mock h3{font-size:23px;margin:0 0 12px;line-height:1.35;}
  .article-mock .byline{font-family:var(--sans);font-size:12px;color:var(--text-2);margin-bottom:14px;}
  .article-mock .body-text{font-size:15px;color:var(--text-1);}

  .post-mock{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 24px;
    margin:22px 0;
  }
  .post-mock .handle{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--text-0);}
  .post-mock .sub{font-family:var(--sans);font-size:11px;color:var(--text-2);margin-bottom:12px;}
  .post-mock .caption{font-size:16px;color:var(--text-0);}
  .post-mock .engagement{
    margin-top:14px;font-family:var(--sans);font-size:12px;color:var(--text-2);
    display:flex;gap:16px;
  }

  /* Choice buttons */
  .choices{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 6px;}
  .choice-btn{
    font-family:var(--sans);
    background:var(--bg-2);
    border:1px solid var(--border);
    color:var(--text-0);
    padding:12px 22px;
    border-radius:100px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:.2s ease;
  }
  .choice-btn:hover{border-color:var(--emerald);background:rgba(16,185,129,.1);transform:translateY(-2px);}
  .choice-btn.selected{
    background:linear-gradient(135deg,var(--emerald),var(--emerald-dim));
    color:#03130b;border-color:transparent;
  }

  textarea, input[type=text]{
    width:100%;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text-0);
    padding:14px 16px;
    font-family:var(--sans);
    font-size:14px;
    resize:vertical;
    min-height:80px;
    margin-top:10px;
    transition:.2s;
  }
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.15);}

  .word-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .word-tag{
    font-family:var(--sans);font-size:13px;
    background:var(--bg-2);border:1px solid var(--border);
    padding:7px 14px;border-radius:100px;cursor:pointer;
    transition:.2s ease;color:var(--text-1);
  }
  .word-tag:hover{border-color:var(--border-hover);}
  .word-tag.picked{
    background:rgba(240,169,58,.15);border-color:var(--amber);color:var(--gold);
  }

  .btn-row{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;}
  .btn{
    font-family:var(--sans);
    padding:13px 26px;
    border-radius:12px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
    letter-spacing:.2px;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--emerald-bright),var(--emerald-dim));
    color:#03130b;
    box-shadow:0 10px 26px rgba(16,185,129,.3);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(16,185,129,.42);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--text-1);
  }
  .btn-ghost:hover{border-color:var(--border-hover);color:var(--text-0);}

  /* Reveal */
  .reveal{
    margin-top:26px;
    padding-top:26px;
    border-top:1px dashed var(--border);
    animation: fadein .6s ease both;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);}}

  .score-hero{
    display:flex;align-items:center;gap:22px;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 26px;
    margin-bottom:20px;
  }
  .score-ring{
    width:84px;height:84px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:22px;font-weight:800;
    position:relative;
  }
  .score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
  .score-ring span{position:relative;z-index:2;}
  .score-hero .score-desc{font-family:var(--sans);}
  .score-hero .score-desc .st{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);margin-bottom:4px;}
  .score-hero .score-desc .sv{font-size:16px;color:var(--text-0);font-weight:600;}

  .mismatch{
    background:rgba(239,83,80,.08);
    border:1px solid rgba(239,83,80,.3);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:10px;
    font-size:14px;
  }
  .mismatch .tag{
    font-family:var(--sans);font-size:10px;letter-spacing:1px;text-transform:uppercase;
    color:var(--red);font-weight:700;margin-bottom:6px;display:block;
  }
  .highlight-strike{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(239,83,80,.6);}
  mark.hl{
    background:rgba(240,169,58,.25);color:var(--gold);
    padding:1px 4px;border-radius:4px;
  }

  .rewrite-box{
    background:rgba(16,185,129,.07);
    border:1px solid rgba(16,185,129,.3);
    border-radius:12px;padding:16px 20px;margin:14px 0;
    font-size:15px;color:var(--text-0);
    font-style:italic;
  }

  .takeaway{
    display:flex;gap:12px;align-items:flex-start;
    background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02));
    border:1px solid var(--border);
    border-radius:12px;padding:16px 20px;margin-top:16px;
  }
  .takeaway .ic{font-size:20px;}
  .takeaway .tx{font-size:14px;color:var(--text-1);font-family:var(--sans);}
  .takeaway .tx b{color:var(--text-0);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0;}
  .info-tile{
    background:var(--bg-2);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;font-family:var(--sans);
  }
  .info-tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-2);margin-bottom:6px;}
  .info-tile .val{font-size:14px;color:var(--text-0);font-weight:600;}

  /* Dashboard */
  .dash-hero{
    text-align:center;padding:50px 30px 40px;
  }
  .dash-hero .big-ring{
    width:160px;height:160px;margin:0 auto 22px;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .dash-hero .big-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
  .dash-hero .big-ring .bn{font-size:44px;font-weight:800;font-family:var(--sans);}
  .dash-hero .big-ring .bs{font-size:12px;color:var(--text-2);font-family:var(--sans);position:absolute;bottom:28px;}
  .dash-hero h2{font-size:30px;margin:0 0 8px;}
  .dash-hero p{color:var(--text-1);max-width:520px;margin:0 auto;}

  .habit-list{display:grid;gap:12px;margin-top:10px;}
  .habit{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--bg-2);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;
  }
  .habit .num{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--emerald),var(--emerald-dim));
    color:#03130b;font-family:var(--sans);font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .habit .htext{font-family:var(--sans);font-size:14px;color:var(--text-1);}
  .habit .htext b{color:var(--text-0);}

  .redflag-box{
    background:rgba(239,83,80,.08);border:1px solid rgba(239,83,80,.28);
    border-radius:12px;padding:18px 20px;margin:18px 0;font-family:var(--sans);
  }
  .redflag-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:6px;font-weight:700;}
  .redflag-box .val{color:var(--text-0);font-size:14px;}

  footer{
    text-align:center;color:var(--text-2);font-family:var(--sans);font-size:12px;margin-top:40px;
  }

  @media (max-width:640px){
    .metrics{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .card{padding:22px;}
    h2.section-title{font-size:23px;}
    .score-hero{flex-direction:column;text-align:center;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>Media Integrity Analyzer</h1>
        <div class="tag">Learn to read between the headlines</div>
      </div>
    </div>
    <div class="stagepill sans" id="stagePill">Intro</div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="metrics">
    <div class="metric">
      <div class="m-label">Headline Accuracy</div>
      <div class="m-value" id="metric-headline">—</div>
      <div class="m-bar-track"><div class="m-bar-fill" id="bar-headline" style="width:0%;background:var(--emerald-bright);"></div></div>
    </div>
    <div class="metric">
      <div class="m-label">Source Reliability</div>
      <div class="m-value" id="metric-source">—</div>
      <div class="m-bar-track"><div class="m-bar-fill" id="bar-source" style="width:0%;background:var(--emerald-bright);"></div></div>
    </div>
    <div class="metric">
      <div class="m-label">Emotional Manipulation</div>
      <div class="m-value" id="metric-emotion">—</div>
      <div class="m-bar-track"><div class="m-bar-fill" id="bar-emotion" style="width:0%;background:var(--amber);"></div></div>
    </div>
    <div class="metric">
      <div class="m-label">Audience Targeting</div>
      <div class="m-value" id="metric-audience">—</div>
      <div class="m-bar-track"><div class="m-bar-fill" id="bar-audience" style="width:0%;background:var(--amber);"></div></div>
    </div>
  </div>

  <div id="app"></div>

  <footer>Media Integrity Analyzer &middot; All content generated for educational simulation purposes &middot; Nothing here reflects real events</footer>
</div>

<script>
(function(){

/* ---------------- DATA POOLS ---------------- */

const headlineScenarios = [
  {
    site: "The Daily Pulse",
    headline: "Local Water Supply 'Poisoned,' Officials Refuse to Explain",
    byline: "Staff Reporter · 3 min read",
    body: "Residents in a quiet suburb were left in a panic this week after routine testing found trace levels of a naturally occurring mineral slightly above the recommended aesthetic guideline — not a health-based safety limit. City officials say the water remains safe to drink and have scheduled a public briefing for next week. No illnesses have been linked to the water supply.",
    misleading: ["'Poisoned'", "Refuse to Explain"],
    accuracy: 34,
    mismatchExplanation: "The word 'poisoned' implies a dangerous toxin, but the article describes a minor mineral level above an aesthetic (taste/appearance) guideline — not a health hazard. 'Refuse to explain' contradicts the article, which says officials scheduled a briefing.",
    fairHeadline: "Minor Mineral Level Found in Local Water; City to Hold Briefing Next Week",
    takeaway: "Loaded verbs like 'poisoned' and framing that implies secrecy ('refuse to explain') can turn a routine regulatory update into a manufactured crisis."
  },
  {
    site: "Wire & Ledger",
    headline: "Scientists Stunned: New Study Proves Coffee Cures Anxiety Overnight",
    byline: "Health Desk · 4 min read",
    body: "A small university study of 40 participants found that a specific compound found in coffee beans was associated with modestly reduced self-reported stress after two weeks of daily consumption. Researchers caution the sample size was small, the effect was mild, and they are not recommending coffee as a treatment for anxiety disorders.",
    misleading: ["'Proves'", "'Cures'", "'Overnight'", "'Scientists Stunned'"],
    accuracy: 18,
    mismatchExplanation: "The study involved only 40 people and found a modest association after two weeks — not overnight proof of a 'cure.' 'Scientists Stunned' is an emotional exaggeration not supported by the researchers' cautious tone.",
    fairHeadline: "Small Study Finds Modest Link Between Coffee Compound and Reduced Stress",
    takeaway: "Words like 'proves' and 'cures' overstate what a single small study can actually show. Real science is usually cautious and incremental."
  },
  {
    site: "Metro Now",
    headline: "City Council Secretly Votes to Raise Taxes on Families",
    byline: "Politics Desk · 2 min read",
    body: "The city council approved a 0.3% increase to the local sales tax during a regularly scheduled, publicly posted meeting that was live-streamed and open to residents. The increase will fund road repairs. The vote was announced two weeks in advance on the city's public calendar.",
    misleading: ["'Secretly'", "'on Families' framing"],
    accuracy: 22,
    mismatchExplanation: "The vote happened in a public, live-streamed, pre-announced meeting — the opposite of 'secretly.' Framing a general 0.3% sales tax as targeting 'families' specifically adds emotional weight not supported by the facts.",
    fairHeadline: "City Council Approves 0.3% Sales Tax Increase for Road Repairs",
    takeaway: "The word 'secretly' is a powerful trigger word. Always ask: was this actually hidden, or just something I hadn't heard about yet?"
  }
];

const emotionScenarios = [
  {
    platform: "Instagram Reel Caption",
    handle: "@glowupdaily",
    sub: "Sponsored · Wellness",
    caption: "Doctors HATE this one trick 😱 I lost 12lbs in 9 days without changing my diet — link in bio before this gets banned again 🔥",
    audience: "Adults (often women 18–34) interested in weight loss or body image, especially those feeling insecure or under time pressure to change their appearance.",
    intendedEmotion: "Urgency, fear of missing out, and insecurity — designed to short-circuit critical thinking with a sense of secrecy and scarcity.",
    technique: "Curiosity gap + manufactured scarcity ('before this gets banned') + authority conspiracy framing ('doctors hate this').",
    emotionalWords: ["HATE", "😱", "before this gets banned", "🔥"],
    neutralRewrite: "This product claims users may lose weight quickly. Results are not independently verified and individual results vary.",
    takeaway: "Phrases implying a secret being hidden from you ('doctors hate this,' 'banned') are a classic manipulation pattern designed to create urgency and distrust of institutions."
  },
  {
    platform: "Twitter/X Post",
    handle: "@newsflash_now",
    sub: "3.2K reposts",
    caption: "They don't want you to see this. Share before it's deleted. What is really happening behind closed doors should terrify every single one of us.",
    audience: "Politically engaged users primed for distrust of institutions, especially those who already feel anxious or powerless about current events.",
    intendedEmotion: "Fear, outrage, and a sense of urgent moral duty to act (share) immediately without verifying.",
    technique: "Vague authority conspiracy ('they don't want you to see this') combined with urgency pressure ('before it's deleted') and fear appeal ('should terrify').",
    emotionalWords: ["don't want you to see", "terrify", "before it's deleted"],
    neutralRewrite: "This post makes a claim about hidden information but provides no verifiable source or evidence.",
    takeaway: "Posts that pressure you to share immediately, before you can verify, are using urgency as a substitute for evidence."
  },
  {
    platform: "Facebook Post",
    handle: "Hometown Values Network",
    sub: "Community Page · 890 shares",
    caption: "Our children are being targeted. If you love your family, you need to read this NOW before it's too late. Share to protect someone you care about.",
    audience: "Parents and grandparents, particularly those active in local community groups, who feel protective and are emotionally invested in child safety.",
    intendedEmotion: "Protective fear and moral obligation — designed to make sharing feel like an act of love rather than a claim requiring verification.",
    technique: "Fear appeal targeting loved ones + guilt-based call to action ('if you love your family') + urgency ('before it's too late').",
    emotionalWords: ["targeted", "if you love your family", "too late", "protect someone you care about"],
    neutralRewrite: "This post makes a safety claim about children without citing a specific source or verified incident.",
    takeaway: "Content that ties sharing to how much you love someone is using guilt, not evidence, to spread. Slow down before you share anything framed this way."
  }
];

/* ---------------- STATE ---------------- */

let state = {
  stage: "intro", // intro, c1-explain, c1-read, c1-guess, c1-reveal, c2-explain, c2-read, c2-guess, c2-reveal, dashboard
  h: null, // chosen headline scenario
  e: null, // chosen emotion scenario
  c1_choice: null,
  c1_picked_phrases: [],
  c2_feeling: "",
  c2_picked_words: [],
  metrics: { headline: null, source: null, emotion: null, audience: null }
};

const stageOrder = ["intro","c1","c1r","c2","c2r","dashboard"];
function stageIndex(){
  if(state.stage==="intro") return 0;
  if(state.stage.startsWith("c1-") && state.stage!=="c1-reveal") return 1;
  if(state.stage==="c1-reveal") return 2;
  if(state.stage.startsWith("c2-") && state.stage!=="c2-reveal") return 3;
  if(state.stage==="c2-reveal") return 4;
  if(state.stage==="dashboard") return 5;
  return 0;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function updateProgress(){
  const idx = stageIndex();
  const pct = Math.round((idx/5)*100);
  document.getElementById('progressFill').style.width = pct+"%";
  const labels = ["Intro","Challenge 1: Reading","Challenge 1: Results","Challenge 2: Reading","Challenge 2: Results","Dashboard"];
  document.getElementById('stagePill').textContent = labels[idx];
}

function updateMetrics(){
  const m = state.metrics;
  function set(id, val, color){
    const valEl = document.getElementById('metric-'+id);
    const barEl = document.getElementById('bar-'+id);
    if(val===null){ valEl.textContent="—"; barEl.style.width="0%"; return; }
    valEl.textContent = val+"%";
    barEl.style.width = val+"%";
  }
  set("headline", m.headline);
  set("source", m.source);
  set("emotion", m.emotion);
  set("audience", m.audience);
}

/* ---------------- RENDER ---------------- */

const app = document.getElementById('app');

function render(){
  updateProgress();
  updateMetrics();
  app.innerHTML = "";
  const view = views[state.stage];
  if(view) app.appendChild(view());
  window.scrollTo({top:0, behavior:'smooth'});
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------------- VIEWS ---------------- */

const views = {};

views["intro"] = function(){

    <div class="concept-box">
      <b>Why this matters:</b> Media literacy isn't about becoming cynical of everything — it's about pausing just long enough to ask "what is this trying to make me feel, and is that supported by the facts?" That one habit changes how you read the internet.
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn">Start Challenge 1 →</button>
    </div>
  `;

views["c1-explain"] = function(){
  const card = el('div','card');

    render();
  };
  return card;

views["c1-guess"] = function(){
  const h = state.h;
  const card = el('div','card');
  card.innerHTML = `
    <div class="eyebrow">Challenge 1 · Headline Detective</div>
    <h2 class="section-title">Read this the way you'd scroll past it.</h2>
    <div class="article-mock">
      <div class="site">${h.site}</div>
      <h3>${h.headline}</h3>
      <div class="byline">${h.byline}</div>
      <div class="body-text">${h.body}</div>
    </div>
    <p class="lead sans" style="font-size:15px;"><b style="color:var(--text-0)">Would you click this?</b></p>
    <div class="choices" id="clickChoices">
      <button class="choice-btn" data-v="Yes">Yes</button>
      <button class="choice-btn" data-v="Maybe">Maybe</button>
      <button class="choice-btn" data-v="No">No</button>
    </div>
    <p class="lead sans" style="font-size:15px;margin-top:22px;"><b style="color:var(--text-0)">Tap any words or phrases in the headline above that feel exaggerated or misleading.</b></p>
    <div class="word-tags" id="c1tags"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="revealBtn" disabled>Reveal the Accuracy Score →</button>
    </div>
  `;

  // click choice buttons
  card.querySelectorAll('#clickChoices .choice-btn').forEach(btn=>{
    btn.onclick = () => {
      card.querySelectorAll('#clickChoices .choice-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      state.c1_choice = btn.dataset.v;
      checkReady();
    };
  });

  // build tappable words from headline (split into chunks incl. the misleading phrases)
  const tagContainer = card.querySelector('#c1tags');
  const words = h.headline.split(/(\s+)/).filter(w=>w.trim().length>0);
  words.forEach(w=>{
    const tag = el('span','word-tag sans', w);
    tag.onclick = () => {
      tag.classList.toggle('picked');
      const idx = state.c1_picked_phrases.indexOf(w);
      if(idx>-1) state.c1_picked_phrases.splice(idx,1);
      else state.c1_picked_phrases.push(w);
      checkReady();
    };
    tagContainer.appendChild(tag);
  });

  const revealBtn = card.querySelector('#revealBtn');
  function checkReady(){
    revealBtn.disabled = !(state.c1_choice && state.c1_picked_phrases.length>0);
  }

  revealBtn.onclick = () => {
    state.stage = "c1-reveal";
    render();
  };

  return card;
};

views["c1-reveal"] = function(){
  const h = state.h;
  state.metrics.headline = h.accuracy;
  state.metrics.source = Math.max(20, h.accuracy - 4 + Math.floor(Math.random()*10));

  const scoreColor = h.accuracy < 40 ? "var(--red)" : h.accuracy < 70 ? "var(--amber)" : "var(--emerald-bright)";
  const circumference = 2*Math.PI*36;
  const offset = circumference - (h.accuracy/100)*circumference;

  const card = el('div','card');
  card.innerHTML = `
    <div class="eyebrow">Challenge 1 · Results</div>
    <h2 class="section-title">Here's what was really going on.</h2>

    <div class="score-hero">
      <div class="score-ring">
        <svg width="84" height="84">
          <circle cx="42" cy="42" r="36" stroke="var(--border)" stroke-width="7" fill="none"/>
          <circle cx="42" cy="42" r="36" stroke="${scoreColor}" stroke-width="7" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" stroke-linecap="round"
            style="transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1);" id="ringC1"/>
        </svg>
        <span style="color:${scoreColor}">${h.accuracy}</span>
      </div>
      <div class="score-desc">
        <div class="st">Headline Accuracy Score</div>
        <div class="sv">${h.accuracy < 40 ? "Significantly Misleading" : h.accuracy < 70 ? "Somewhat Exaggerated" : "Fairly Accurate"}</div>
      </div>
    </div>

    <div style="font-family:var(--sans);font-size:13px;color:var(--text-2);margin-bottom:6px;">Mismatches between the headline and the article:</div>
    ${h.misleading.map(m=>`<div class="mismatch"><span class="tag">Exaggeration</span>${m} — not fully supported by the article body.</div>`).join('')}

    <p style="margin-top:18px;font-size:15px;color:var(--text-1);">${h.mismatchExplanation}</p>

    <div style="font-family:var(--sans);font-size:13px;color:var(--text-2);margin:20px 0 4px;">A fairer, more accurate headline would be:</div>
    <div class="rewrite-box">"${h.fairHeadline}"</div>

    <div class="takeaway">
      <div class="ic">💡</div>
      <div class="tx"><b>Key takeaway:</b> ${h.takeaway}</div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="toC2">Continue to Challenge 2 →</button>
    </div>
  `;
  requestAnimationFrame(()=>{
    const ring = card.querySelector('#ringC1');
    if(ring) ring.style.strokeDashoffset = offset;
  });
  card.querySelector('#toC2').onclick = () => {
    state.e = pick(emotionScenarios);
    state.stage = "c2-explain";
    render();
  };
  return card;
};

views["c2-guess"] = function(){
  const e = state.e;
  const card = el('div','card');
  card.innerHTML = `
    <div class="eyebrow">Challenge 2 · Emotion Detector</div>
    <h2 class="section-title">Read it the way you'd scroll past it.</h2>
    <div class="post-mock">
      <div class="handle">${e.handle}</div>
      <div class="sub">${e.platform} · ${e.sub}</div>
      <div class="caption">${e.caption}</div>

  `;

  const feelingInput = card.querySelector('#feelingInput');

  feelingInput.oninput = () => { state.c2_feeling = feelingInput.value; checkReady2(); };

  const tagContainer2 = card.querySelector('#c2tags');
  const words2 = e.caption.split(/(\s+)/).filter(w=>w.trim().length>0);
  words2.forEach(w=>{
    const tag = el('span','word-tag sans', w);
    tag.onclick = () => {
      tag.classList.toggle('picked');
      const idx = state.c2_picked_words.indexOf(w);
      if(idx>-1) state.c2_picked_words.splice(idx,1);
      else state.c2_picked_words.push(w);

views["c2-reveal"] = function(){
  const e = state.e;
  const manipulationScore = 65 + Math.floor(Math.random()*25); // 65-90, high manipulation
  const audienceScore = 60 + Math.floor(Math.random()*30);
  state.metrics.emotion = manipulationScore;
  state.metrics.audience = audienceScore;

  const card = el('div','card');
  card.innerHTML = `
    <div class="eyebrow">Challenge 2 · Results</div>
    <h2 class="section-title">Here's the technique behind the feeling.</h2>

    <div class="grid-2">
      <div class="info-tile">
        <div class="lbl">Target Audience</div>

      </div>
    </div>

      <div class="val">${e.technique}</div>

views["dashboard"] = function(){
  const m = state.metrics;
  const overall = Math.round((m.headline + m.source + (100-m.emotion) + (100-m.audience)) / 4);
  const scoreColor = overall < 40 ? "var(--red)" : overall < 70 ? "var(--amber)" : "var(--emerald-bright)";
  const circumference = 2*Math.PI*70;
  const offset = circumference - (overall/100)*circumference;

  const biggestRedFlag = m.emotion >= m.audience
    ? `Emotional manipulation techniques (like "${state.e.emotionalWords[0]}") were the strongest signal of manufactured urgency in this session.`
    : `Precise audience targeting made the content feel personally relevant, which lowered your natural skepticism.`;

  const card = el('div','card');
  card.innerHTML = `
    <div class="dash-hero">
      <div class="eyebrow" style="justify-content:center;">Media Integrity Dashboard</div>
      <div class="big-ring">
        <svg width="160" height="160">
          <circle cx="80" cy="80" r="70" stroke="var(--border)" stroke-width="10" fill="none"/>
          <circle cx="80" cy="80" r="70" stroke="${scoreColor}" stroke-width="10" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" stroke-linecap="round"
            style="transition:stroke-dashoffset 1.3s cubic-bezier(.65,0,.35,1);" id="ringDash"/>
        </svg>
        <span class="bn" style="color:${scoreColor}">${overall}</span>
      </div>
      <h2>Overall Media Integrity Score</h2>
      <p>Based on how you navigated headline accuracy and emotional manipulation in this session.</p>
    </div>

    <div class="eyebrow">What You Learned</div>
    <p class="lead">You practiced spotting the gap between what a headline <i>implies</i> and what an article <i>actually says</i>, and you identified specific words designed to trigger fear, urgency, or insecurity in social content.</p>

    <div class="redflag-box">
      <div class="lbl">Biggest Red Flag This Session</div>
      <div class="val">${biggestRedFlag}</div>
    </div>

    <div class="eyebrow" style="margin-top:26px;">Three Habits to Take With You</div>
    <div class="habit-list">
      <div class="habit"><div class="num">1</div><div class="htext"><b>Read past the headline.</b> Before reacting, skim the first two paragraphs — the real claim usually lives there, not in the title.</div></div>
      <div class="habit"><div class="num">2</div><div class="htext"><b>Name the emotion.</b> If something makes you feel urgent fear or outrage in under five seconds, pause and ask what evidence is actually being offered.</div></div>
      <div class="habit"><div class="num">3</div><div class="htext"><b>Check who benefits.</b> Ask who is targeted by this content and what they gain — a click, a share, a sale — if you react without checking.</div></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="replayBtn">🔄 Replay With New Scenarios</button>
    </div>
  `;
  requestAnimationFrame(()=>{
    const ring = card.querySelector('#ringDash');
    if(ring) ring.style.strokeDashoffset = offset;
  });
  card.querySelector('#replayBtn').onclick = () => {
    state = {
      stage: "intro",
      h: null, e: null,
      c1_choice: null, c1_picked_phrases: [],
      c2_feeling: "", c2_picked_words: [],
      metrics: { headline: null, source: null, emotion: null, audience: null }
    };
    render();
  };
  return card;
};

render();
})();
</script>
