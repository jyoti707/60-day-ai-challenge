<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Readiness Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A3D;         /* deep clinical navy */
    --ink-2:#1D4459;
    --paper:#F4F1EA;       /* not using warm-cream default look; we use as subtle secondary only */
    --bg:#EEF2F1;          /* cool clinical off-white */
    --panel:#FFFFFF;
    --line:#D8E0DD;
    --teal:#0E7C7B;        /* signature accent - clinical teal */
    --teal-deep:#0A5F5E;
    --amber:#B7791F;
    --amber-bg:#FDF3E1;
    --red:#B3311C;
    --red-bg:#FBEAE6;
    --green:#1E7A45;
    --green-bg:#E7F3EB;
    --slate:#5B6B70;
  }
  html,body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); }
  .font-display{ font-family:'Newsreader', serif; }
  .font-mono{ font-family:'IBM Plex Mono', monospace; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:2px; }
  .chip{ font-family:'IBM Plex Mono', monospace; letter-spacing:.04em; }
  ::selection{ background: var(--teal); color:#fff; }
  input:focus, select:focus, button:focus-visible, .focusable:focus-visible{
    outline: 2px solid var(--teal); outline-offset: 2px;
  }
  .status-approved{ background:var(--green-bg); color:var(--green); border-color:#bfe0cb; }
  .status-pending{ background:var(--amber-bg); color:var(--amber); border-color:#f0dcaf; }
  .status-denied{ background:var(--red-bg); color:var(--red); border-color:#eec3ba; }
  .status-neutral{ background:#EEF2F1; color:var(--slate); border-color:var(--line); }

  .track-fill{ transition: width .9s cubic-bezier(.22,.8,.28,1); }
  .pulse-dot{ animation:pulse-dot 1.8s ease-in-out infinite; }
  @keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .fade-up{ animation:fadeUp .5s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .track-fill{transition:none;} .pulse-dot{animation:none;} .fade-up{animation:none;}
  }

  .milestone-line::before{
    content:""; position:absolute; left:0; right:0; top:11px; height:2px; background:var(--line);
  }
  .milestone-line .fill{
    content:""; position:absolute; left:0; top:11px; height:2px; background:var(--teal); transition:width .8s ease;
  }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .badge-illustrative{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.06em; }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="max-w-5xl mx-auto px-5 sm:px-8 pb-24"></div>

<template id="tpl-root"></template>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     DATA
  --------------------------------------------------------- */
  const DIAGNOSES = ["Acute MI","CHF","Pneumonia","Elective Surgery","Hip Fracture"];
  const ADMISSION_TYPES = ["Inpatient","Observation","Emergency","ICU","Same-Day Surgery"];
  const HIGH_CRITERIA_DX = ["Acute MI","CHF"];
  const HIGH_CLINICAL_RISK_DX = ["Acute MI","CHF"];

  const WEIGHTS = { pa:25, docs:20, orders:20, insurance:15, consent:10, bed:10 };

  const WORKFLOW_ACTIONS = [
    { key:"bed", label:"Assign Bed", verb:"Bed assigned", icon:"bed" },
    { key:"insurance", label:"Verify Insurance", verb:"Insurance verified", icon:"shield" },
    { key:"docs", label:"Upload Documentation", verb:"Documentation uploaded", icon:"file" },
    { key:"consent", label:"Complete Consent", verb:"Consent completed", icon:"sign" },
    { key:"physician", label:"Contact Physician", verb:"Physician contacted", icon:"phone" },
    { key:"nursing", label:"Notify Nursing", verb:"Nursing notified", icon:"bell" },
    { key:"arrival", label:"Prepare Patient Arrival", verb:"Arrival prep confirmed", icon:"door" },
  ];

  const MILESTONES = ["PA Review","Insurance Verification","Bed Assignment","Documentation","Consent","Patient Arrival","Registration","Clinical Assessment","Admission Complete"];

  const CARE_TEAM = [
    { role:"Attending", name:null, desc:"Owns the clinical care plan and admitting orders." },
    { role:"Case Manager", name:"J. Ferro, RN", desc:"Coordinates the admission pathway end to end." },
    { role:"Nursing", name:"Unit 4 Charge RN", desc:"Confirms bed readiness and receiving-unit staffing." },
    { role:"Utilization Review", name:"UR Team", desc:"Runs concurrent review and denial-risk identification against InterQual and Milliman criteria." },
    { role:"Discharge Planner", name:"M. Okafor, LCSW", desc:"Begins discharge planning at admission to avoid downstream delay." },
  ];

  const ICONS = {
    bed: `<path d="M3 18v-7a2 2 0 0 1 2-2h3v4"/><path d="M3 13h18v5"/><path d="M7 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6"/><circle cx="7.5" cy="9" r="1"/>`,
    shield: `<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>`,
    file: `<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/>`,
    sign: `<path d="M4 20h16"/><path d="M6 16l9-9 3 3-9 9H6v-3z"/>`,
    phone: `<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>`,
    bell: `<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/>`,
    door: `<path d="M5 21V5a2 2 0 0 1 2-2h6l6 4v14"/><path d="M13 3v18"/><circle cx="10" cy="12" r=".6" fill="currentColor"/>`,
    check: `<path d="M20 6L9 17l-5-5"/>`,
    warn: `<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>`,
    clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>`,
    arrow: `<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>`,
    x: `<path d="M18 6L6 18"/><path d="M6 6l12 12"/>`,
    info: `<circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/>`,
  };
  function icon(name, cls="w-4 h-4"){
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||""}</svg>`;
  }

  /* ---------------------------------------------------------
     STATE
  --------------------------------------------------------- */
  let state = {
    stage: "setup", // setup -> analysis -> workflow -> decision
    setup: {
      provider: "", attending: "", diagnosis: "", admissionType: "",
      paStatusInput: "", admissionDate: ""
    },
    pa: { status: "", appealSubmitted:false, appealResolved:false },
    statuses: {}, // insurance, bed, docs, orders, consent -> 'complete'|'pending'|'issue'
    actionsLog: [],
    riskNotes: [],
  };

  function seededRandom(seedStr){
    let h = 0;
    for (let i=0;i<seedStr.length;i++){ h = Math.imul(31,h) + seedStr.charCodeAt(i) | 0; }
    return function(){
      h = Math.imul(h ^ (h>>>15), 1 | h);
      h ^= h + Math.imul(h ^ (h>>>7), 61 | h);
      return ((h ^ (h>>>14))>>>0) / 4294967296;
    };
  }

  /* ---------------------------------------------------------
     SCORE ENGINE
  --------------------------------------------------------- */
  function paScoreFraction(){
    // fraction of the PA weight earned
    if (state.pa.status === "Approved") return 1;
    if (state.pa.status === "Denied") return state.pa.appealResolved ? 1 : 0.15;
    if (state.pa.status === "Pending") return 0.4;
    return 0;
  }
  function statusFraction(key){
    const s = state.statuses[key];
    if (s === "complete") return 1;
    if (s === "pending") return 0.45;
    if (s === "issue") return 0.15;
    return 0.1; // not started
  }

  function computeScore(){
    let total = 0;
    total += WEIGHTS.pa * paScoreFraction();
    total += WEIGHTS.docs * statusFraction("docs");
    total += WEIGHTS.orders * statusFraction("orders");
    total += WEIGHTS.insurance * statusFraction("insurance");
    total += WEIGHTS.consent * statusFraction("consent");
    total += WEIGHTS.bed * statusFraction("bed");

    let score = Math.round(total);

    // Hard cap: Denied PA + ICU cannot exceed 70% from admin tasks alone
    if (state.pa.status === "Denied" && !state.pa.appealResolved && state.setup.admissionType === "ICU"){
      score = Math.min(score, 69);
    }
    return Math.max(0, Math.min(100, score));
  }

  function clinicalRiskWeighted(){
    return HIGH_CLINICAL_RISK_DX.includes(state.setup.diagnosis) || state.setup.admissionType === "ICU";
  }

  /* ---------------------------------------------------------
     INIT ANALYSIS (randomized-but-seeded initial statuses, 30-60%)
  --------------------------------------------------------- */
  function runInitialAnalysis(){
    const rand = seededRandom(state.setup.provider + state.setup.attending + state.setup.admissionDate + state.setup.diagnosis);

    // PA
    const paInput = state.setup.paStatusInput;
    state.pa.status = paInput;

    // Seed sub-statuses leaning toward "pending"/"issue" so overall lands 30-60%
    const pool = ["pending","pending","issue","complete"];
    const pick = (bias) => {
      const r = rand();
      if (bias === "docs") return r < 0.15 ? "issue" : r < 0.65 ? "pending" : "complete";
      if (bias === "orders") return r < 0.1 ? "issue" : r < 0.6 ? "pending" : "complete";
      if (bias === "insurance") return r < 0.2 ? "pending" : r < 0.3 ? "issue" : "complete";
      if (bias === "consent") return r < 0.5 ? "pending" : "complete";
      if (bias === "bed") return r < 0.35 ? "pending" : "complete";
      return pool[Math.floor(r*pool.length)];
    };

    state.statuses = {
      insurance: pick("insurance"),
      bed: pick("bed"),
      docs: pick("docs"),
      orders: pick("orders"),
      consent: pick("consent"),
    };

    // clamp score into 30-60 band by nudging if needed
    let tries = 0;
    while ((computeScore() < 30 || computeScore() > 60) && tries < 25){
      const keys = ["insurance","bed","docs","orders","consent"];
      const k = keys[Math.floor(rand()*keys.length)];
      const cur = computeScore();
      if (cur < 30){
        state.statuses[k] = state.statuses[k] === "issue" ? "pending" : state.statuses[k] === "pending" ? "complete" : state.statuses[k];
      } else {
        state.statuses[k] = state.statuses[k] === "complete" ? "pending" : state.statuses[k] === "pending" ? "issue" : state.statuses[k];
      }
      tries++;
    }

    state.riskNotes = buildRiskFlags();
  }

  function buildRiskFlags(){
    const flags = [];
    if (state.statuses.docs !== "complete") flags.push("Documentation Risk");
    if (state.statuses.insurance !== "complete") flags.push("Insurance Risk");
    if (state.statuses.bed !== "complete") flags.push("Bed Risk");
    if (clinicalRiskWeighted() || state.statuses.orders !== "complete") flags.push("Clinical Risk");
    return [...new Set(flags)];
  }

  /* ---------------------------------------------------------
     RENDER HELPERS
  --------------------------------------------------------- */
  const el = (html) => { const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; };
  const app = document.getElementById("app");

  function statusPill(status){
    const map = {
      complete: {cls:"status-approved", label:"Complete", ic:"check"},
      pending: {cls:"status-pending", label:"Pending", ic:"clock"},
      issue: {cls:"status-denied", label:"Needs Attention", ic:"warn"},
      "not-started": {cls:"status-neutral", label:"Not Started", ic:"clock"},
    };
    const m = map[status] || map["not-started"];
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 border rounded-sm text-xs font-medium chip ${m.cls}">${icon(m.ic,"w-3.5 h-3.5")}${m.label}</span>`;
  }

  function paPill(){
    const map = {
      Approved: {cls:"status-approved", ic:"check", label:"Approved"},
      Pending: {cls:"status-pending", ic:"clock", label:"Pending"},
      Denied: {cls:"status-denied", ic:"x", label:"Denied"},
    };
    let status = state.pa.status;
    if (status === "Denied" && state.pa.appealResolved) { status = "Approved"; }
    const m = map[status] || map["Pending"];
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 border rounded-sm text-xs font-medium chip ${m.cls}">${icon(m.ic,"w-3.5 h-3.5")}${m.label}${state.pa.appealResolved?" (Appeal)":""}</span>`;
  }

  function illustrativeTag(){
    return `<span class="badge-illustrative text-[var(--slate)] uppercase">Illustrative training data</span>`;
  }

  function header(){
    const stageLabels = {setup:"Setup", analysis:"Readiness Analysis", workflow:"Workflow", decision:"Decision"};
    return `
    <header class="pt-8 sm:pt-10 pb-6 border-b border-[var(--line)] mb-8 flex items-end justify-between gap-4 flex-wrap">
      <div>
        <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--teal-deep)] mb-1.5">Hospital Admission Coordinator · Training Simulation</div>
        <h1 class="font-display text-[28px] sm:text-[32px] leading-tight text-[var(--ink)]">Admission Readiness Simulator</h1>
      </div>
      <div class="flex items-center gap-2">
        ${["setup","analysis","workflow","decision"].map((s,i)=>`
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full ${state.stage===s ? "bg-[var(--teal)]" : (stageOrder(s) < stageOrder(state.stage) ? "bg-[var(--ink-2)]" : "bg-[var(--line)]")}"></span>
            <span class="chip text-[11px] uppercase tracking-wide ${state.stage===s ? "text-[var(--ink)]" : "text-[var(--slate)]"}">${stageLabels[s]}</span>
            ${i<3?`<span class="text-[var(--line)] mx-1">/</span>`:""}
          </div>`).join("")}
      </div>
    </header>`;
  }
  function stageOrder(s){ return {setup:0,analysis:1,workflow:2,decision:3}[s]; }

  /* ---------------------------------------------------------
     VIEW: SETUP
  --------------------------------------------------------- */
  function renderSetup(){
    const s = state.setup;
    const showObs = s.admissionType === "Observation";
    const showCriteria = HIGH_CRITERIA_DX.includes(s.diagnosis);

    app.innerHTML = `
      ${header()}
      <div class="fade-up">
        <div class="mb-6">
          <p class="text-[15px] text-[var(--slate)] max-w-2xl leading-relaxed">Enter the admission details below. This information drives the readiness analysis — PA status, insurance, bed assignment, documentation, physician orders, and consent are evaluated against it.</p>
        </div>

        <div class="card p-6 sm:p-8 grid sm:grid-cols-2 gap-x-8 gap-y-6">
          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">Provider <span class="normal-case font-sans">${illustrativeTag()}</span></label>
            <input id="f-provider" type="text" placeholder="e.g. Meridian Health Partners" value="${s.provider}"
              class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable"/>
          </div>
          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">Attending Physician <span class="normal-case font-sans">${illustrativeTag()}</span></label>
            <input id="f-attending" type="text" placeholder="e.g. Dr. A. Whitfield" value="${s.attending}"
              class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable"/>
          </div>

          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">Diagnosis</label>
            <select id="f-diagnosis" class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable">
              <option value="">Select diagnosis…</option>
              ${DIAGNOSES.map(d=>`<option value="${d}" ${s.diagnosis===d?"selected":""}>${d}</option>`).join("")}
            </select>
            ${showCriteria ? `
            <div class="mt-2 flex items-start gap-2 text-[13px] text-[var(--amber)] bg-[var(--amber-bg)] border border-[#f0dcaf] px-3 py-2 rounded-sm leading-snug">
              ${icon("info","w-4 h-4 mt-0.5 shrink-0")}
              <span>InterQual/Milliman thresholds apply — ensure documentation meets medical necessity standards before UR review.</span>
            </div>`:""}
          </div>

          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">Admission Type</label>
            <select id="f-admtype" class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable">
              <option value="">Select admission type…</option>
              ${ADMISSION_TYPES.map(d=>`<option value="${d}" ${s.admissionType===d?"selected":""}>${d}</option>`).join("")}
            </select>
            ${showObs ? `
            <div class="mt-2 flex items-start gap-2 text-[13px] text-[var(--ink-2)] bg-[#EAF2F1] border border-[#c9dcda] px-3 py-2 rounded-sm leading-snug">
              ${icon("info","w-4 h-4 mt-0.5 shrink-0")}
              <span><strong>CMS 2-Midnight Rule applies</strong> — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.</span>
            </div>`:""}
          </div>

          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">PA Status</label>
            <select id="f-pastatus" class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable">
              <option value="">Select PA status…</option>
              <option value="Approved" ${s.paStatusInput==="Approved"?"selected":""}>Approved</option>
              <option value="Pending" ${s.paStatusInput==="Pending"?"selected":""}>Pending</option>
              <option value="Denied" ${s.paStatusInput==="Denied"?"selected":""}>Denied</option>
            </select>
          </div>

          <div>
            <label class="block text-xs chip uppercase tracking-wide text-[var(--slate)] mb-1.5">Admission Date</label>
            <input id="f-date" type="date" value="${s.admissionDate}"
              class="w-full px-3 py-2.5 border border-[var(--line)] bg-white rounded-sm text-sm focusable"/>
          </div>
        </div>

        <div class="mt-7 flex items-center justify-between flex-wrap gap-3">
          <p id="setup-error" class="text-sm text-[var(--red)] hidden"></p>
          <button id="btn-analyze" class="ml-auto inline-flex items-center gap-2 bg-[var(--ink)] hover:bg-[var(--ink-2)] text-white px-5 py-3 rounded-sm text-sm font-semibold transition-colors focusable">
            🏥 Analyze Admission Readiness
          </button>
        </div>
      </div>
    `;

    document.getElementById("f-provider").addEventListener("input", e=> s.provider = e.target.value);
    document.getElementById("f-attending").addEventListener("input", e=> s.attending = e.target.value);
    document.getElementById("f-diagnosis").addEventListener("change", e=>{ s.diagnosis = e.target.value; renderSetup(); });
    document.getElementById("f-admtype").addEventListener("change", e=>{ s.admissionType = e.target.value; renderSetup(); });
    document.getElementById("f-pastatus").addEventListener("change", e=> s.paStatusInput = e.target.value);
    document.getElementById("f-date").addEventListener("change", e=> s.admissionDate = e.target.value);

    document.getElementById("btn-analyze").addEventListener("click", ()=>{
      const missing = [];
      if(!s.provider.trim()) missing.push("Provider");
      if(!s.attending.trim()) missing.push("Attending Physician");
      if(!s.diagnosis) missing.push("Diagnosis");
      if(!s.admissionType) missing.push("Admission Type");
      if(!s.paStatusInput) missing.push("PA Status");
      if(!s.admissionDate) missing.push("Admission Date");
      const errEl = document.getElementById("setup-error");
      if (missing.length){
        errEl.textContent = `Missing required fields: ${missing.join(", ")}`;
        errEl.classList.remove("hidden");
        return;
      }
      runInitialAnalysis();
      state.stage = "analysis";
      render();
    });
  }

  /* ---------------------------------------------------------
     VIEW: ANALYSIS
  --------------------------------------------------------- */
  function renderAnalysis(){
    const score = computeScore();
    const s = state.setup;

    app.innerHTML = `
      ${header()}
      <div class="fade-up space-y-6">

        <div class="card p-6 sm:p-7">
          <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
            <div>
              <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-1">Patient Admission</div>
              <div class="font-display text-xl">${s.diagnosis} · ${s.admissionType}</div>
              <div class="text-sm text-[var(--slate)] mt-1">Provider: ${escapeHtml(s.provider)} &nbsp;·&nbsp; Attending: ${escapeHtml(s.attending)} &nbsp;·&nbsp; ${illustrativeTag()}</div>
            </div>
            <div class="text-right">
              <div class="chip text-[11px] uppercase tracking-wide text-[var(--slate)]">Admission Date</div>
              <div class="font-mono text-sm">${formatDate(s.admissionDate)}</div>
            </div>
          </div>

          ${s.admissionType === "Observation" ? `
          <div class="flex items-start gap-2 text-[13px] text-[var(--ink-2)] bg-[#EAF2F1] border border-[#c9dcda] px-3 py-2.5 rounded-sm leading-snug mb-4">
            ${icon("info","w-4 h-4 mt-0.5 shrink-0")}
            <span><strong>CMS 2-Midnight Rule applies</strong> — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.</span>
          </div>` : ""}

          ${HIGH_CRITERIA_DX.includes(s.diagnosis) ? `
          <div class="flex items-start gap-2 text-[13px] text-[var(--amber)] bg-[var(--amber-bg)] border border-[#f0dcaf] px-3 py-2.5 rounded-sm leading-snug mb-4">
            ${icon("info","w-4 h-4 mt-0.5 shrink-0")}
            <span>InterQual/Milliman thresholds apply — ensure documentation meets medical necessity standards before UR review.</span>
          </div>` : ""}

          <!-- Score ring/track -->
          <div class="mt-2">
            <div class="flex items-baseline justify-between mb-1.5">
              <span class="chip text-[11px] uppercase tracking-wide text-[var(--slate)]">Readiness Score</span>
              <span class="font-display text-3xl text-[var(--ink)]">${score}%</span>
            </div>
            <div class="h-2.5 w-full bg-[var(--bg)] rounded-full overflow-hidden border border-[var(--line)]">
              <div class="track-fill h-full bg-[var(--teal)] rounded-full" style="width:${score}%"></div>
            </div>
            <div class="text-xs text-[var(--slate)] mt-2">Score reflects PA (25%), Clinical Documentation (20%), Physician Orders (20%), Insurance (15%), Consent (10%), Bed (10%). Final admission decision is not yet determined.</div>
          </div>
        </div>

        ${renderCategoryGrid()}

        ${renderPaBranch()}

        ${renderTimeline()}

        <div class="flex justify-end">
          <button id="btn-to-workflow" class="inline-flex items-center gap-2 bg-[var(--teal)] hover:bg-[var(--teal-deep)] text-white px-5 py-3 rounded-sm text-sm font-semibold transition-colors focusable">
            Proceed to Workflow ${icon("arrow","w-4 h-4")}
          </button>
        </div>
      </div>
    `;

    document.getElementById("btn-to-workflow").addEventListener("click", ()=>{
      state.stage = "workflow";
      render();
    });

    wirePaBranchEvents();
  }

  function renderCategoryGrid(){
    const rows = [
      { key:"pa", label:"PA Status", custom: paPill() },
      { key:"insurance", label:"Insurance", status: state.statuses.insurance },
      { key:"bed", label:"Bed", status: state.statuses.bed },
      { key:"docs", label:"Documentation", status: state.statuses.docs },
      { key:"orders", label:"Physician Orders", status: state.statuses.orders },
      { key:"consent", label:"Consent", status: state.statuses.consent },
    ];
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-4">Initial Analysis</div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${rows.map(r=>`
          <div class="border border-[var(--line)] rounded-sm px-4 py-3 flex items-center justify-between gap-3">
            <span class="text-sm font-medium">${r.label}</span>
            ${r.custom ? r.custom : statusPill(r.status)}
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function renderPaBranch(){
    if (state.pa.status === "Approved" || state.pa.appealResolved){
      return `
      <div class="card p-6 sm:p-7">
        <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3">Prior Authorization</div>
        <div class="flex items-center gap-2 text-sm text-[var(--green)]">${icon("check","w-4 h-4")} PA Approved — continue with admission workflow.</div>
      </div>`;
    }
    if (state.pa.status === "Pending"){
      return `
      <div class="card p-6 sm:p-7">
        <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3">Prior Authorization — Pending</div>
        <p class="text-sm text-[var(--slate)] mb-4">PA is pending payer response. Choose an action to move it forward.</p>
        <div class="flex flex-wrap gap-2.5">
          <button data-pa-action="followup" class="pa-btn px-4 py-2.5 border border-[var(--line)] rounded-sm text-sm font-medium hover:border-[var(--teal)] hover:text-[var(--teal-deep)] transition-colors focusable">Follow Up</button>
          <button data-pa-action="upload" class="pa-btn px-4 py-2.5 border border-[var(--line)] rounded-sm text-sm font-medium hover:border-[var(--teal)] hover:text-[var(--teal-deep)] transition-colors focusable">Upload Docs</button>
          <button data-pa-action="contact" class="pa-btn px-4 py-2.5 border border-[var(--line)] rounded-sm text-sm font-medium hover:border-[var(--teal)] hover:text-[var(--teal-deep)] transition-colors focusable">Contact Physician</button>
        </div>
        <div id="pa-log" class="mt-4 space-y-1.5"></div>
      </div>`;
    }
    if (state.pa.status === "Denied"){
      return `
      <div class="card p-6 sm:p-7">
        <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--red)] mb-3">Prior Authorization — Denied</div>
        <p class="text-sm text-[var(--slate)] mb-4">PA was denied by the payer (${illustrativeTag()}). Review the reason and consider an appeal.</p>
        <div class="flex flex-wrap gap-2.5">
          <button data-pa-action="reason" class="pa-btn px-4 py-2.5 border border-[var(--line)] rounded-sm text-sm font-medium hover:border-[var(--teal)] hover:text-[var(--teal-deep)] transition-colors focusable">Review Reason</button>
          <button data-pa-action="contactins" class="pa-btn px-4 py-2.5 border border-[var(--line)] rounded-sm text-sm font-medium hover:border-[var(--teal)] hover:text-[var(--teal-deep)] transition-colors focusable">Contact Insurance</button>
          <button data-pa-action="appeal" class="pa-btn px-4 py-2.5 bg-[var(--ink)] text-white rounded-sm text-sm font-semibold hover:bg-[var(--ink-2)] transition-colors focusable">Submit Appeal</button>
        </div>
        ${state.setup.admissionType === "ICU" ? `<div class="mt-4 text-[13px] text-[var(--red)] bg-[var(--red-bg)] border border-[#eec3ba] px-3 py-2.5 rounded-sm">Denied PA on an ICU admission caps readiness at 69% until resolved — admin tasks alone cannot overcome this.</div>` : ""}
        <div id="pa-log" class="mt-4 space-y-1.5"></div>
      </div>`;
    }
    return "";
  }

  function wirePaBranchEvents(){
    document.querySelectorAll(".pa-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const action = btn.getAttribute("data-pa-action");
        const log = document.getElementById("pa-log");
        const messages = {
          followup: "Follow-up sent to payer. Awaiting response.",
          upload: "Supporting clinical documentation uploaded to payer portal.",
          contact: "Attending physician contacted for peer-to-peer availability.",
          reason: "Denial reason: insufficient documentation of medical necessity per InterQual criteria.",
          contactins: "Insurance case representative contacted (illustrative training data).",
          appeal: null, // handled below
        };
        if (action === "appeal"){
          state.pa.appealSubmitted = true;
          // simulate resolution
          state.pa.appealResolved = true;
          state.stage = "analysis";
          render();
          flashToast("Appeal submitted and approved — PA status updated to Approved.");
          return;
        }
        if (log){
          const item = el(`<div class="fade-up flex items-center gap-2 text-[13px] text-[var(--ink-2)]">${icon("check","w-3.5 h-3.5 text-[var(--teal)]")}<span>${messages[action]}</span></div>`);
          log.appendChild(item);
        }
        btn.disabled = true;
        btn.classList.add("opacity-50","cursor-not-allowed");
      });
    });
  }

  function renderTimeline(){
    const completedIdx = timelineProgressIndex();
    const pct = (completedIdx / (MILESTONES.length-1)) * 100;
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-6">Admission Timeline</div>
      <div class="relative milestone-line overflow-x-auto scrollbar-thin pb-2">
        <div class="fill absolute top-[11px] left-0 h-0.5 bg-[var(--teal)]" style="width:${pct}%"></div>
        <div class="flex justify-between min-w-[820px] relative">
          ${MILESTONES.map((m,i)=>`
            <div class="flex flex-col items-center gap-2.5 flex-1">
              <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center bg-white z-10
                ${i < completedIdx ? "border-[var(--teal)] bg-[var(--teal)] text-white" : i===completedIdx ? "border-[var(--teal)] text-[var(--teal)]" : "border-[var(--line)] text-[var(--line)]"}">
                ${i < completedIdx ? icon("check","w-3.5 h-3.5") : `<span class="w-1.5 h-1.5 rounded-full ${i===completedIdx?'bg-[var(--teal)] pulse-dot':'bg-[var(--line)]'}"></span>`}
              </div>
              <span class="text-[11px] chip text-center leading-tight ${i<=completedIdx ? "text-[var(--ink)]" : "text-[var(--slate)]"}" style="max-width:90px;">${m}</span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>`;
  }

  function timelineProgressIndex(){
    // Map completed workflow actions + PA to milestone index
    let idx = 0;
    const paDone = state.pa.status === "Approved" || state.pa.appealResolved;
    if (paDone) idx = Math.max(idx,1);
    if (state.statuses.insurance === "complete") idx = Math.max(idx,2);
    if (state.statuses.bed === "complete") idx = Math.max(idx,3);
    if (state.statuses.docs === "complete") idx = Math.max(idx,4);
    if (state.statuses.consent === "complete") idx = Math.max(idx,5);
    if (state.actionsLog.includes("arrival")) idx = Math.max(idx,6);
    if (state.actionsLog.includes("arrival") && state.actionsLog.includes("nursing")) idx = Math.max(idx,7);
    if (state.statuses.orders === "complete" && idx>=7) idx = Math.max(idx,8);
    if (state.stage === "decision" && computeScore() >= 90) idx = MILESTONES.length-1;
    return Math.min(idx, MILESTONES.length-1);
  }

  /* ---------------------------------------------------------
     VIEW: WORKFLOW
  --------------------------------------------------------- */
  function renderWorkflow(){
    const score = computeScore();
    app.innerHTML = `
      ${header()}
      <div class="fade-up space-y-6">

        <div class="card p-6 sm:p-7">
          <div class="flex items-baseline justify-between mb-1.5">
            <span class="chip text-[11px] uppercase tracking-wide text-[var(--slate)]">Readiness Score</span>
            <span class="font-display text-3xl text-[var(--ink)]">${score}%</span>
          </div>
          <div class="h-2.5 w-full bg-[var(--bg)] rounded-full overflow-hidden border border-[var(--line)]">
            <div class="track-fill h-full bg-[var(--teal)] rounded-full" style="width:${score}%"></div>
          </div>
        </div>

        <div class="card p-6 sm:p-7">
          <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-4">Workflow Actions</div>
          <div class="grid sm:grid-cols-2 gap-3">
            ${WORKFLOW_ACTIONS.map(a=>{
              const done = state.actionsLog.includes(a.key);
              return `
              <button data-action="${a.key}" class="wf-btn text-left flex items-center justify-between gap-3 px-4 py-3.5 border rounded-sm transition-colors focusable
                ${done ? "border-[#bfe0cb] bg-[var(--green-bg)] cursor-default" : "border-[var(--line)] hover:border-[var(--teal)] hover:bg-[#f4faf9]"}" ${done?"disabled":""}>
                <span class="flex items-center gap-3">
                  <span class="w-8 h-8 rounded-full flex items-center justify-center border ${done ? "border-[var(--green)] text-[var(--green)]" : "border-[var(--line)] text-[var(--ink-2)]"}">${icon(done?"check":a.icon,"w-4 h-4")}</span>
                  <span class="text-sm font-medium">${done ? a.verb : a.label}</span>
                </span>
                ${!done ? icon("arrow","w-4 h-4 text-[var(--slate)]") : ""}
              </button>`;
            }).join("")}
          </div>
        </div>

        ${renderRiskTracking()}

        ${renderCareTeam()}

        ${renderTimeline()}

        ${score >= 75 ? renderGovernanceSnapshot() : ""}

        <div class="flex justify-between items-center gap-3 flex-wrap">
          <button id="btn-back" class="text-sm text-[var(--slate)] hover:text-[var(--ink)] underline underline-offset-4 focusable">Back to analysis</button>
          <button id="btn-decision" class="inline-flex items-center gap-2 bg-[var(--ink)] hover:bg-[var(--ink-2)] text-white px-5 py-3 rounded-sm text-sm font-semibold transition-colors focusable">
            Finalize Admission Decision ${icon("arrow","w-4 h-4")}
          </button>
        </div>
      </div>
    `;

    document.getElementById("btn-back").addEventListener("click", ()=>{ state.stage="analysis"; render(); });
    document.getElementById("btn-decision").addEventListener("click", ()=>{ state.stage="decision"; render(); });

    document.querySelectorAll(".wf-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.getAttribute("data-action");
        if (state.actionsLog.includes(key)) return;
        state.actionsLog.push(key);
        // advance relevant status
        const map = { insurance:"insurance", bed:"bed", docs:"docs", consent:"consent" };
        if (map[key]) state.statuses[map[key]] = "complete";
        if (key === "physician" && state.statuses.orders !== "complete"){
          state.statuses.orders = state.statuses.orders === "pending" ? "complete" : "pending";
        }
        state.riskNotes = buildRiskFlags();
        render();
      });
    });
  }

  function renderRiskTracking(){
    const risks = [
      { key:"Documentation Risk", active: state.statuses.docs !== "complete", detail:"Missing or incomplete clinical documentation may delay UR review." },
      { key:"Insurance Risk", active: state.statuses.insurance !== "complete", detail:"Coverage not yet verified; billing may be delayed or denied." },
      { key:"Bed Risk", active: state.statuses.bed !== "complete", detail:"No confirmed bed assignment for the admitting unit." },
      { key:"Clinical Risk", active: clinicalRiskWeighted() || state.statuses.orders !== "complete",
        detail: clinicalRiskWeighted() ? "Weighted higher for this diagnosis/admission type — monitor closely." : "Physician orders incomplete." },
    ];
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-4">Risk Tracking</div>
      <div class="grid sm:grid-cols-2 gap-3">
        ${risks.map(r=>`
          <div class="border rounded-sm px-4 py-3 ${r.active ? "border-[#eec3ba] bg-[var(--red-bg)]" : "border-[#bfe0cb] bg-[var(--green-bg)]"}">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="text-sm font-semibold ${r.active ? "text-[var(--red)]" : "text-[var(--green)]"}">${r.key}</span>
              ${icon(r.active?"warn":"check", `w-4 h-4 ${r.active ? "text-[var(--red)]" : "text-[var(--green)]"}`)}
            </div>
            <p class="text-[13px] text-[var(--slate)] leading-snug">${r.detail}</p>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function renderCareTeam(){
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-4">Care Coordination</div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${CARE_TEAM.map(c=>`
          <div class="border border-[var(--line)] rounded-sm px-4 py-3.5">
            <div class="text-sm font-semibold text-[var(--ink)]">${c.role}</div>
            <div class="text-xs chip text-[var(--slate)] mb-1.5">${c.role==="Attending" ? escapeHtml(state.setup.attending || "Unassigned") : c.name}</div>
            <p class="text-[13px] text-[var(--slate)] leading-snug">${c.desc}</p>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function renderGovernanceSnapshot(){
    return `
    <div class="card p-6 sm:p-7 border-l-4" style="border-left-color:var(--teal)">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3">Governance Snapshot</div>
      <div class="grid sm:grid-cols-3 gap-4 text-sm">
        <div><div class="font-display text-xl">3–5 days</div><div class="text-[13px] text-[var(--slate)]">PA turnaround (estimate)</div></div>
        <div><div class="font-display text-xl">~8–10%</div><div class="text-[13px] text-[var(--slate)]">Inpatient denial rate (CMS, estimate)</div></div>
        <div><div class="font-display text-xl">~$11</div><div class="text-[13px] text-[var(--slate)]">PA rework cost per transaction (CAQH, estimate)</div></div>
      </div>
      <p class="text-[11px] text-[var(--slate)] mt-3">Industry benchmarks shown are estimates only, for training context.</p>
    </div>`;
  }

  /* ---------------------------------------------------------
     VIEW: DECISION
  --------------------------------------------------------- */
  function renderDecision(){
    const score = computeScore();
    const admit = score >= 90;
    const s = state.setup;

    const missing = [];
    if (!(state.pa.status === "Approved" || state.pa.appealResolved)) missing.push("Prior authorization not yet approved");
    if (state.statuses.insurance !== "complete") missing.push("Insurance verification incomplete");
    if (state.statuses.bed !== "complete") missing.push("Bed not yet assigned");
    if (state.statuses.docs !== "complete") missing.push("Clinical documentation incomplete");
    if (state.statuses.orders !== "complete") missing.push("Physician orders incomplete");
    if (state.statuses.consent !== "complete") missing.push("Consent not completed");

    const requiredActions = missing.length ? missing.map(m=>`Resolve: ${m}`) : [];
    const remainingRisks = buildRiskFlags();

    app.innerHTML = `
      ${header()}
      <div class="fade-up space-y-6">

        <div class="card p-8 sm:p-10 text-center">
          <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3">Final Decision</div>
          <div class="font-display text-4xl sm:text-5xl mb-3 ${admit ? "text-[var(--green)]" : "text-[var(--amber)]"}">
            ${admit ? "✅ Admit" : "⚠ Not Ready"}
          </div>
          <div class="inline-flex items-center gap-2 chip text-sm text-[var(--slate)] mb-1">Readiness Score</div>
          <div class="font-display text-2xl">${score}%</div>
          <div class="h-2.5 w-full max-w-md mx-auto bg-[var(--bg)] rounded-full overflow-hidden border border-[var(--line)] mt-3">
            <div class="track-fill h-full ${admit?"bg-[var(--green)]":"bg-[var(--amber)]"} rounded-full" style="width:${score}%"></div>
          </div>
        </div>

        ${admit ? renderAdmitSummary() : renderNotReadySummary(requiredActions, remainingRisks)}

        ${renderTimeline()}

        <div class="flex justify-between items-center gap-3 flex-wrap">
          <button id="btn-back-wf" class="text-sm text-[var(--slate)] hover:text-[var(--ink)] underline underline-offset-4 focusable">Back to workflow</button>
          <button id="btn-restart" class="inline-flex items-center gap-2 border border-[var(--line)] hover:border-[var(--ink)] px-5 py-3 rounded-sm text-sm font-semibold transition-colors focusable">Start New Simulation</button>
        </div>
      </div>
    `;

    document.getElementById("btn-back-wf").addEventListener("click", ()=>{ state.stage="workflow"; render(); });
    document.getElementById("btn-restart").addEventListener("click", ()=>{
      state = { stage:"setup", setup:{provider:"",attending:"",diagnosis:"",admissionType:"",paStatusInput:"",admissionDate:""}, pa:{status:"",appealSubmitted:false,appealResolved:false}, statuses:{}, actionsLog:[], riskNotes:[] };
      render();
    });
  }

  function renderAdmitSummary(){
    const s = state.setup;
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-4">Admission Summary</div>
      <div class="grid sm:grid-cols-2 gap-4 text-sm">
        <div><span class="text-[var(--slate)]">Diagnosis</span><div class="font-medium">${s.diagnosis}</div></div>
        <div><span class="text-[var(--slate)]">Admission Type</span><div class="font-medium">${s.admissionType}</div></div>
        <div><span class="text-[var(--slate)]">Provider</span><div class="font-medium">${escapeHtml(s.provider)} ${illustrativeTag()}</div></div>
        <div><span class="text-[var(--slate)]">Attending</span><div class="font-medium">${escapeHtml(s.attending)} ${illustrativeTag()}</div></div>
        <div><span class="text-[var(--slate)]">Admission Date</span><div class="font-medium font-mono">${formatDate(s.admissionDate)}</div></div>
        <div><span class="text-[var(--slate)]">PA Status</span><div class="font-medium">${paPill()}</div></div>
      </div>
      <div class="mt-5 pt-5 border-t border-[var(--line)] grid sm:grid-cols-3 gap-3">
        ${["insurance","bed","docs","orders","consent"].map(k=>`
          <div class="flex items-center justify-between border border-[var(--line)] rounded-sm px-3 py-2">
            <span class="text-xs text-[var(--slate)] capitalize">${k}</span>${statusPill(state.statuses[k])}
          </div>`).join("")}
      </div>
      ${s.admissionType === "Observation" ? `
      <div class="mt-4 flex items-start gap-2 text-[13px] text-[var(--ink-2)] bg-[#EAF2F1] border border-[#c9dcda] px-3 py-2.5 rounded-sm leading-snug">
        ${icon("info","w-4 h-4 mt-0.5 shrink-0")}
        <span><strong>CMS 2-Midnight Rule applies</strong> — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.</span>
      </div>`:""}
    </div>`;
  }

  function renderNotReadySummary(requiredActions, remainingRisks){
    return `
    <div class="card p-6 sm:p-7">
      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3">Missing Items</div>
      ${requiredActions.length ? `
      <ul class="space-y-2 mb-5">
        ${requiredActions.map(a=>`<li class="flex items-start gap-2 text-sm"><span class="text-[var(--amber)] mt-0.5">${icon("warn","w-4 h-4")}</span><span>${a}</span></li>`).join("")}
      </ul>` : `<p class="text-sm text-[var(--slate)] mb-5">All core items are complete, but the readiness score has not yet reached the 90% admission threshold.</p>`}

      <div class="chip text-[11px] uppercase tracking-[.14em] text-[var(--slate)] mb-3 pt-3 border-t border-[var(--line)]">Remaining Risks</div>
      ${remainingRisks.length ? `
      <div class="flex flex-wrap gap-2">
        ${remainingRisks.map(r=>`<span class="chip text-xs px-2.5 py-1 border border-[#eec3ba] bg-[var(--red-bg)] text-[var(--red)] rounded-sm">${r}</span>`).join("")}
      </div>` : `<p class="text-sm text-[var(--slate)]">No active risk flags.</p>`}

      <div class="mt-5 pt-5 border-t border-[var(--line)] text-sm text-[var(--slate)]">
        Return to the workflow to complete remaining actions, then re-finalize the decision.
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------
     UTIL
  --------------------------------------------------------- */
  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function formatDate(d){
    if (!d) return "—";
    const dt = new Date(d + "T00:00:00");
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
  }
  function flashToast(msg){
    const t = el(`<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[var(--ink)] text-white text-sm px-4 py-3 rounded-sm shadow-lg fade-up z-50 flex items-center gap-2">${icon("check","w-4 h-4 text-[var(--teal)]")}<span>${msg}</span></div>`);
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(()=>t.remove(),450); }, 2600);
  }

  /* ---------------------------------------------------------
     MAIN RENDER SWITCH
  --------------------------------------------------------- */
  function render(){
    window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
    if (state.stage === "setup") renderSetup();
    else if (state.stage === "analysis") renderAnalysis();
    else if (state.stage === "workflow") renderWorkflow();
    else if (state.stage === "decision") renderDecision();
  }

  render();
})();
</script>
</body>
</html>
