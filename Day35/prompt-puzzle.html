<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
  :root{
    --bg:#0b0e14;
    --bg-panel:#12151f;
    --bg-panel-2:#171b28;
    --line:#242938;
    --text:#e7e9f2;
    --text-dim:#8790a8;
    --cyan:#4fd6d0;
    --violet:#a78bfa;
    --amber:#f5b942;
    --red:#f2596b;
    --green:#5fd97e;
    --mono: 'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(79,214,208,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(167,139,250,0.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--cyan);color:#04201f;}
  a{color:var(--cyan);}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border:1px solid var(--line);
    border-radius:14px;background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
    margin-bottom:26px;
    position:sticky;top:14px;z-index:50;
    backdrop-filter:blur(8px);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);}
  .brand small{color:var(--text-dim);font-weight:500;display:block;font-size:11px;margin-top:2px;}
  .stat-row{display:flex;gap:18px;flex-wrap:wrap;}
  .stat{font-family:var(--mono);font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;align-items:flex-end;}
  .stat b{color:var(--text);font-size:15px;font-family:var(--sans);font-weight:700;}
  .stat b.good{color:var(--green);}
  .stat b.warn{color:var(--amber);}

  /* ---------- Cards / Panels ---------- */
  .panel{
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
    border-radius:16px;padding:26px;margin-bottom:20px;
  }
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--cyan);margin:0 0 10px;
  }
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.3px;}
  h2{font-size:20px;margin:0 0 14px;}
  p.lead{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:640px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--sans);font-weight:600;font-size:14px;
    padding:11px 20px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg-panel-2);color:var(--text);cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 6px 20px rgba(79,214,208,.15);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg,var(--cyan),#38b6b0);color:#04201f;border:none;font-weight:700;}
  .btn.primary:hover{box-shadow:0 8px 26px rgba(79,214,208,.35);}
  .btn.ghost{background:transparent;}
  .btn.violet{background:linear-gradient(135deg,var(--violet),#8b6cf0);color:#1a0e3d;border:none;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}

  /* ---------- Setup screen ---------- */
  .option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px;}
  .option-card{
    border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;
    background:var(--bg-panel-2);transition:.15s;
  }
  .option-card:hover{border-color:var(--cyan);transform:translateY(-2px);}
  .option-card.selected{border-color:var(--cyan);background:rgba(79,214,208,.08);box-shadow:0 0 0 1px var(--cyan) inset;}
  .option-card .icon{font-size:22px;margin-bottom:8px;display:block;}
  .option-card b{display:block;font-size:14px;margin-bottom:4px;}
  .option-card span{font-size:12px;color:var(--text-dim);}

  /* ---------- Progress ---------- */
  .progress-track{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 4px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:6px;transition:width .4s ease;}
  .scenario-pips{display:flex;gap:6px;margin-bottom:18px;}
  .pip{width:26px;height:6px;border-radius:4px;background:var(--line);transition:.2s;}
  .pip.done{background:var(--green);}
  .pip.active{background:var(--cyan);}

  /* ---------- Challenge layout ---------- */
  .tag{
    display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.5px;
    padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);
    text-transform:uppercase;
  }
  .tag.build{color:var(--cyan);border-color:rgba(79,214,208,.4);}
  .tag.clean{color:var(--amber);border-color:rgba(245,185,66,.4);}
  .tag.choose{color:var(--violet);border-color:rgba(167,139,250,.4);}

  .desired-box{
    border:1px dashed var(--line);border-radius:12px;padding:16px;margin:16px 0;
    background:rgba(79,214,208,.04);font-size:14px;line-height:1.55;
  }
  .desired-box b{color:var(--cyan);}

  .blocks-zone{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
  @media(max-width:760px){.blocks-zone{grid-template-columns:1fr;}}
  .zone-title{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
  .zone{
    min-height:220px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;gap:10px;transition:.15s;
  }
  .zone.dragover{border-color:var(--cyan);background:rgba(79,214,208,.06);}
  .block{
    border:1px solid var(--line);background:var(--bg-panel-2);
    border-radius:10px;padding:12px 14px;font-size:13.5px;cursor:grab;
    display:flex;align-items:center;gap:10px;line-height:1.4;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .block:hover{border-color:var(--cyan);transform:translateX(2px);}
  .block:active{cursor:grabbing;}
  .block .handle{color:var(--text-dim);font-size:12px;}
  .block.correct-flash{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset;animation:pulseGood .5s;}
  .block.wrong-flash{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;animation:pulseBad .5s;}
  .block.removable::after{content:'✕';margin-left:auto;color:var(--text-dim);font-size:12px;}
  @keyframes pulseGood{0%{background:rgba(95,217,126,.25);}100%{background:var(--bg-panel-2);}}
  @keyframes pulseBad{0%{background:rgba(242,89,107,.25);}100%{background:var(--bg-panel-2);}}
  .block.dragging{opacity:.4;}

  .choice-card{
    border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;
    background:var(--bg-panel-2);transition:.15s;
  }
  .choice-card:hover{border-color:var(--cyan);transform:translateY(-2px);}
  .choice-card b{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
  .choice-card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--text);}
  .choice-card.correct{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset;background:rgba(95,217,126,.06);}
  .choice-card.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;background:rgba(242,89,107,.06);}
  .choice-card.disabled{pointer-events:none;}

  .clean-list{display:flex;flex-direction:column;gap:10px;}
  .clean-item{
    border:1px solid var(--line);background:var(--bg-panel-2);border-radius:10px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;transition:.15s;
  }
  .clean-item:hover{border-color:var(--cyan);}
  .clean-item .cb{
    width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-dim);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .clean-item.picked .cb{background:var(--red);border-color:var(--red);color:#fff;}
  .clean-item.picked{opacity:.55;text-decoration:line-through;}

  .helper-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:12px;}

  /* ---------- Feedback / notification toast ---------- */
  .toast-stack{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:200;}
  .toast{
    font-family:var(--mono);font-size:13px;padding:12px 18px;border-radius:10px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:slideIn .35s ease, fadeOut .4s ease 2.2s forwards;
    min-width:200px;
  }
  .toast.good{border-color:var(--green);color:var(--green);}
  .toast.bad{border-color:var(--red);color:var(--red);}
  .toast.info{border-color:var(--violet);color:var(--violet);}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes fadeOut{to{opacity:0;transform:translateX(20px);}}

  .score-pop{
    position:fixed;pointer-events:none;font-family:var(--mono);font-weight:700;font-size:20px;
    color:var(--green);z-index:300;animation:popUp 1s ease forwards;
  }
  @keyframes popUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-60px);opacity:0;}}

  /* ---------- Report ---------- */
  .report-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;}
  @media(max-width:820px){.report-grid{grid-template-columns:1fr;}}
  .big-score{font-size:64px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;
    background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .rank-badge{
    display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;
    padding:6px 14px;border-radius:20px;border:1px solid var(--amber);color:var(--amber);margin-top:8px;
  }
  .metric-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  .metric{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg-panel-2);}
  .metric span{display:block;font-size:11px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;}
  .metric b{font-size:20px;}
  .dna-wrap{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .dna-row{display:flex;align-items:center;gap:10px;}
  .dna-label{width:120px;font-size:12px;color:var(--text-dim);font-family:var(--mono);flex-shrink:0;}
  .dna-bar-track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .dna-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .8s ease;}
  .dna-val{width:34px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .final-prompt{
    font-family:var(--mono);font-size:13px;line-height:1.7;background:#0a0d13;border:1px solid var(--line);
    border-radius:12px;padding:16px;white-space:pre-wrap;color:var(--cyan);margin-top:10px;
  }
  .milestone-box{border:1px solid var(--violet);border-radius:12px;padding:16px;background:rgba(167,139,250,.06);margin-top:16px;}
  .milestone-box b{color:var(--violet);}
  .feedback-box{border-left:3px solid var(--cyan);padding:10px 16px;margin-top:16px;background:rgba(79,214,208,.04);border-radius:0 8px 8px 0;}

  /* ---------- Compare panels (optimize view) ---------- */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media(max-width:760px){.compare-grid{grid-template-columns:1fr;}}
  .compare-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg-panel-2);}
  .compare-card.weak{border-color:rgba(242,89,107,.4);}
  .compare-card.opt{border-color:rgba(95,217,126,.4);}
  .compare-card h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;}
  .compare-card.weak h4{color:var(--red);}
  .compare-card.opt h4{color:var(--green);}
  .compare-card p{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0;}
  .principle-strip{
    margin-top:16px;font-size:13px;padding:12px 16px;border-radius:10px;
    background:rgba(245,185,66,.06);border:1px solid rgba(245,185,66,.35);color:var(--amber);
  }
  footer{text-align:center;color:var(--text-dim);font-size:12px;margin-top:40px;font-family:var(--mono);}
  .hint-box{font-size:12.5px;color:var(--amber);margin-top:10px;font-family:var(--mono);}
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<div class="wrap">
  <div class="topbar">
    <div class="brand">🧩 Prompt Puzzle
      <small>Master AI Prompting Through Play</small>
    </div>
    <div class="stat-row" id="topStats"></div>
  </div>

  <div id="app"></div>

  <footer>Prompt Puzzle · runs 100% offline · no data leaves this file</footer>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   DATA — Scenario bank (Software Development / Intermediate)
   ===================================================================== */
const SCENARIO_BANK = [
{
  id:'sd1',
  title:'Refactoring a Legacy Function',
  desiredOutput:'A clean, refactored version of a messy JavaScript function, with an explanation of each change and no altered behavior.',
  correctBlocks:[
    "Act as a senior JavaScript engineer doing a code review.",
    "Refactor the following function for readability and maintainability without changing its behavior.",
    "Explain each change you make in a short bullet list below the code.",
    "Keep the function signature identical so existing callers are unaffected."
  ],
  distractorBlocks:[
    "Rewrite the entire codebase from scratch.",
    "Make the code as short as possible even if it hurts readability.",
    "Add unrelated new features to the function.",
    "Respond only with emojis."
  ],
  weakPrompt:"fix this code",
  optimizedPrompt:"Act as a senior JavaScript engineer. Refactor the following function for readability and maintainability without changing its behavior. Keep the function signature identical, and list each change you made in bullet points below the refactored code.",
  overEngineeredPrompt:"You are the world's #1 greatest legendary 10x JavaScript ninja rockstar guru engineer with 50 years of experience across every framework ever created. Refactor this code perfectly using every design pattern imaginable, add exhaustive comments on every single line, rewrite it in three different paradigms (functional, OOP, and reactive), include a 2000-word essay on software philosophy, and format everything with excessive markdown headers, tables, and emoji for every bullet point.",
  weakOutput:"Here's fixed code: [renames a variable, behavior may differ, no explanation given].",
  optimizedOutput:"Refactored function with the same signature and behavior, plus a concise bullet list explaining exactly what changed and why (e.g., extracted helper, replaced loop with .map, clarified naming).",
  principle:"Specify role, constraints, and output format — vague verbs like 'fix' invite guesswork, while explicit constraints (behavior preserved, signature unchanged) keep the model's changes safe and reviewable."
},
{
  id:'sd2',
  title:'Writing Unit Tests',
  desiredOutput:'A set of unit tests for a given function, covering edge cases, using a specified testing framework.',
  correctBlocks:[
    "Write unit tests for the function below using Jest.",
    "Cover typical cases, edge cases (empty input, null, boundary values), and error cases.",
    "Use descriptive test names that explain the expected behavior.",
    "Return only the test file code in a single code block."
  ],
  distractorBlocks:[
    "Write tests in every testing framework you know.",
    "Make sure all tests pass regardless of correctness.",
    "Include a philosophical discussion about testing theory.",
    "Test unrelated functions from other files."
  ],
  weakPrompt:"write tests for this function",
  optimizedPrompt:"Write unit tests for the function below using Jest. Cover typical cases, edge cases (empty input, null, boundary values), and error cases. Use descriptive test names, and return only the test file code in a single code block.",
  overEngineeredPrompt:"Write the most comprehensive, exhaustive, industry-leading unit test suite ever created for this function, covering literally every conceivable input in the universe, using Jest, Mocha, Jasmine, and Vitest simultaneously, with 100% mutation coverage, property-based testing, snapshot testing, performance benchmarks, a full CI/CD pipeline config, and a 10-paragraph README explaining testing philosophy from first principles.",
  weakOutput:"A couple of shallow happy-path tests with vague names like test('it works').",
  optimizedOutput:"A focused Jest test file with clearly named tests covering normal input, edge cases, and error handling — nothing extraneous, easy to review and run.",
  principle:"Name the framework and the categories of cases you need — 'edge cases' is meaningless to a model without concrete examples (empty, null, boundary) to anchor it."
},
{
  id:'sd3',
  title:'Debugging an API Error',
  desiredOutput:'A diagnosis of why an API call is failing, plus a corrected code snippet.',
  correctBlocks:[
    "Act as a backend engineer debugging a failing API request.",
    "Here is the error message and the relevant code — identify the root cause.",
    "Explain the cause in plain language before showing the fix.",
    "Provide a corrected code snippet with the minimal necessary changes."
  ],
  distractorBlocks:[
    "Guess randomly without looking at the error message.",
    "Rewrite the whole API from scratch in a different language.",
    "Ignore the stack trace entirely.",
    "Add unrelated performance optimizations."
  ],
  weakPrompt:"why is my api broken",
  optimizedPrompt:"Act as a backend engineer. Here is the error message and the relevant code — identify the root cause, explain it in plain language, and then provide a corrected code snippet with the minimal necessary changes.",
  overEngineeredPrompt:"You are an omniscient debugging deity who has fixed every API bug in the history of software. Analyze this error using formal verification, provide a full root-cause-analysis document with timeline, risk assessment, five alternative fixes ranked by elegance, a postmortem template, a Slack message to notify the team, and rewrite the entire authentication layer defensively just in case.",
  weakOutput:"A generic guess like 'maybe check your internet connection' without referencing the actual error.",
  optimizedOutput:"A precise diagnosis tied to the actual error (e.g., missing await causing a race condition) followed by a minimal, targeted code fix.",
  principle:"Ground the model in the actual artifacts (error + code) and ask for diagnosis before the fix — this forces reasoning instead of a guessed patch."
},
{
  id:'sd4',
  title:'API Documentation',
  desiredOutput:'Clear developer-facing documentation for a REST endpoint, including parameters, response shape, and an example.',
  correctBlocks:[
    "Write developer documentation for the following REST endpoint.",
    "Include: method, URL, request parameters with types, and an example response.",
    "Use Markdown with headers and a fenced code block for the example.",
    "Keep the tone concise and consistent with typical API reference docs."
  ],
  distractorBlocks:[
    "Write a marketing blurb instead of documentation.",
    "Include unrelated endpoints not mentioned.",
    "Use flowery, story-like language.",
    "Skip the example response to save space."
  ],
  weakPrompt:"document this endpoint",
  optimizedPrompt:"Write developer documentation for the following REST endpoint in Markdown. Include the method, URL, request parameters with types, and an example response in a fenced code block. Keep the tone concise, consistent with standard API reference docs.",
  overEngineeredPrompt:"Create the most legendary, award-winning API documentation ever written, including a full changelog since the dawn of the project, SDK examples in fifteen programming languages, a video script, marketing copy, a FAQ section with 30 questions, ASCII art diagrams, and a philosophical treatise on REST architecture.",
  weakOutput:"A short vague paragraph describing the endpoint with no parameter list or example.",
  optimizedOutput:"Well-structured Markdown docs with a clear parameter table, typed fields, and a realistic example response block.",
  principle:"Specify the exact sections and format needed (method, params, example) so the model produces reference-quality docs instead of prose."
},
{
  id:'sd5',
  title:'SQL Query Optimization',
  desiredOutput:'An optimized version of a slow SQL query with an explanation of why it is faster.',
  correctBlocks:[
    "Act as a database performance engineer.",
    "Optimize the following SQL query for performance on a large table.",
    "Explain what was inefficient and why your version is faster.",
    "Preserve the exact same result set as the original query."
  ],
  distractorBlocks:[
    "Switch to a completely different database engine.",
    "Change the query's output columns without telling anyone.",
    "Add indexes on every column regardless of usage.",
    "Ignore whether results stay the same."
  ],
  weakPrompt:"make this query faster",
  optimizedPrompt:"Act as a database performance engineer. Optimize the following SQL query for performance on a large table. Explain what was inefficient and why your version is faster, and make sure the result set stays identical to the original.",
  overEngineeredPrompt:"You are the greatest database wizard in the multiverse. Rewrite this query using every optimization technique known to mankind, redesign the entire schema, propose a sharding strategy, a caching layer, a migration plan, and write a 3000-word whitepaper comparing every SQL engine on the market, even though only one query needs fixing.",
  weakOutput:"A query with SELECT * still in place and no explanation of what changed.",
  optimizedOutput:"A tightened query (specific columns, proper indexing hints, avoided N+1 pattern) with a short explanation of the bottleneck it fixed, and an identical result set.",
  principle:"Constrain the scope explicitly ('same result set', 'this query') so optimization suggestions stay targeted instead of ballooning into an unrelated architecture redesign."
},
{
  id:'sd6',
  title:'Code Review Comments',
  desiredOutput:'Constructive code review feedback on a pull request diff, prioritized by severity.',
  correctBlocks:[
    "Act as a thoughtful senior reviewer leaving comments on this pull request diff.",
    "Group feedback into: must-fix issues, suggestions, and nitpicks.",
    "For each issue, reference the specific line or snippet it relates to.",
    "Keep the tone constructive and specific, not just 'looks good'."
  ],
  distractorBlocks:[
    "Approve the PR without reading it.",
    "Only comment on code style, ignore bugs.",
    "Write comments in a harsh, dismissive tone.",
    "Review files that aren't part of the diff."
  ],
  weakPrompt:"review this PR",
  optimizedPrompt:"Act as a thoughtful senior reviewer. Leave comments on this pull request diff, grouped into must-fix issues, suggestions, and nitpicks. For each issue, reference the specific line or snippet, and keep the tone constructive and specific.",
  overEngineeredPrompt:"You are a legendary tech lead reviewing this PR as if it were the most important code in human history. Provide a 5000-word review covering every conceivable angle: security, performance, architecture, philosophy of software design, team dynamics, career advice for the author, a full rewrite of the feature, and a performance review recommendation for their manager.",
  weakOutput:"Looks good to me! (no specifics, no line references).",
  optimizedOutput:"Feedback split into must-fix / suggestions / nitpicks, each tied to a specific line, written in a constructive and actionable tone.",
  principle:"Ask for a prioritized structure (must-fix vs. nitpick) tied to specific lines — this turns vague feedback into an actionable, scannable review."
}
];

/* Assign challenge types cyclically across scenarios */
const CHALLENGE_TYPES = ['build','clean','choose'];

/* =====================================================================
   STATE
   ===================================================================== */
let state = null;

function freshState(domain, difficulty){
  const scenarios = shuffle(SCENARIO_BANK.slice()).slice(0,6).map((s,i)=>({
    ...s,
    challengeType: CHALLENGE_TYPES[i % CHALLENGE_TYPES.length]
  }));
  return {
    domain, difficulty,
    scenarios,
    index:0,
    startTime:Date.now(),
    scenarioStart:Date.now(),
    totalMoves:0,
    wrongPlacements:0,
    hintsUsed:0,
    correctAnswers:0,
    optimizationBonus:0,
    perScenario:[],
    finished:false
  };
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* =====================================================================
   RENDER ROOT
   ===================================================================== */
const app = document.getElementById('app');
const topStats = document.getElementById('topStats');

function renderTopStats(){
  if(!state || state.finished){ topStats.innerHTML=''; return; }
  const elapsed = Math.floor((Date.now()-state.startTime)/1000);
  topStats.innerHTML = `
    <div class="stat">Scenario<b>${Math.min(state.index+1,state.scenarios.length)}/${state.scenarios.length}</b></div>
    <div class="stat">Moves<b>${state.totalMoves}</b></div>
    <div class="stat">Wrong<b class="${state.wrongPlacements? 'warn':''}">${state.wrongPlacements}</b></div>
    <div class="stat">Hints<b class="${state.hintsUsed? 'warn':''}">${state.hintsUsed}</b></div>
    <div class="stat">Time<b>${formatTime(elapsed)}</b></div>
  `;
}
setInterval(renderTopStats, 1000);

function formatTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

/* =====================================================================
   TOASTS + SCORE POP
   ===================================================================== */
function toast(msg, kind='info'){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function scorePop(x,y,text){
  const el = document.createElement('div');
  el.className='score-pop';
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

/* =====================================================================
   SETUP SCREEN
   ===================================================================== */
const DOMAINS = [
  {id:'Software Development', icon:'💻', desc:'Code, debugging, docs & tests'},
  {id:'Business/Marketing', icon:'📈', desc:'Campaigns, copy & strategy'},
  {id:'Creative Writing', icon:'✍️', desc:'Stories, tone & narrative'},
  {id:'Data Analysis', icon:'📊', desc:'Insights, queries & reports'},
  {id:'Education/Instructional Design', icon:'🎓', desc:'Lessons, explainers & rubrics'}
];
const DIFFICULTIES = [
  {id:'Beginner', icon:'🟢', desc:'Clear guidance, generous hints'},
  {id:'Intermediate', icon:'🟡', desc:'Balanced challenge, fewer hints'},
  {id:'Advanced', icon:'🔴', desc:'Subtle traps, tight scoring'}
];

let setupDomain = 'Software Development';
let setupDifficulty = 'Intermediate';

function renderSetup(){
  app.innerHTML = `
    <div class="panel">
      <div class="eyebrow">New Session</div>
      <h1>Configure your training run</h1>
      <p class="lead">Pick a domain and difficulty, then generate 6 fresh, randomized prompting scenarios drawn from a reusable scenario bank.</p>

      <h2 style="margin-top:26px;font-size:15px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;">Domain</h2>
      <div class="option-grid" id="domainGrid"></div>

      <h2 style="margin-top:26px;font-size:15px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;">Difficulty</h2>
      <div class="option-grid" id="diffGrid"></div>

      <div class="btn-row">
        <button class="btn primary" id="startBtn">▶ Generate Scenarios</button>
      </div>
    </div>
  `;
  const dg = document.getElementById('domainGrid');
  DOMAINS.forEach(d=>{
    const c = document.createElement('div');
    c.className = 'option-card' + (d.id===setupDomain?' selected':'');
    c.innerHTML = `<span class="icon">${d.icon}</span><b>${d.id}</b><span>${d.desc}</span>`;
    c.onclick = ()=>{ setupDomain = d.id; renderSetup(); };
    dg.appendChild(c);
  });
  const dfg = document.getElementById('diffGrid');
  DIFFICULTIES.forEach(d=>{
    const c = document.createElement('div');
    c.className = 'option-card' + (d.id===setupDifficulty?' selected':'');
    c.innerHTML = `<span class="icon">${d.icon}</span><b>${d.id}</b><span>${d.desc}</span>`;
    c.onclick = ()=>{ setupDifficulty = d.id; renderSetup(); };
    dfg.appendChild(c);
  });
  document.getElementById('startBtn').onclick = ()=>{
    state = freshState(setupDomain, setupDifficulty);
    toast(`Loaded ${state.scenarios.length} scenarios for ${setupDomain} (${setupDifficulty})`, 'good');
    renderScenario();
  };
}

/* =====================================================================
   SCENARIO ROUTER
   ===================================================================== */
function renderScenario(){
  if(state.index >= state.scenarios.length){
    return renderReport();
  }
  state.scenarioStart = Date.now();
  const sc = state.scenarios[state.index];
  renderTopStats();
  if(sc.challengeType==='build') renderBuild(sc);
  else if(sc.challengeType==='clean') renderClean(sc);
  else renderChoose(sc);
}

function scenarioHeader(sc, typeLabel){
  return `
    <div class="scenario-pips">
      ${state.scenarios.map((s,i)=>`<div class="pip ${i<state.index?'done':i===state.index?'active':''}"></div>`).join('')}
    </div>
    <span class="tag ${sc.challengeType}">${typeLabel}</span>
    <h1 style="margin-top:10px;">${sc.title}</h1>
    <div class="desired-box"><b>🎯 Desired Output:</b> ${sc.desiredOutput}</div>
  `;
}

/* =====================================================================
   CHALLENGE 1 — BUILD THE PROMPT (drag correct blocks into prompt zone)
   ===================================================================== */
function renderBuild(sc){
  const allBlocks = shuffle([
    ...sc.correctBlocks.map(t=>({text:t, correct:true})),
    ...sc.distractorBlocks.map(t=>({text:t, correct:false}))
  ]);
  let placed = [];
  let wrongThisScenario = 0;
  let hintUsed = false;

  app.innerHTML = `
    <div class="panel">
      ${scenarioHeader(sc,'Build the Prompt')}
      <p class="lead">Drag the blocks that belong in a strong prompt into the "Your Prompt" zone, in a sensible order. Avoid distractor blocks that would weaken or bloat the prompt.</p>
      <div class="blocks-zone">
        <div>
          <div class="zone-title">Available Blocks</div>
          <div class="zone" id="sourceZone"></div>
        </div>
        <div>
          <div class="zone-title">Your Prompt</div>
          <div class="zone" id="targetZone"></div>
        </div>
      </div>
      <div class="hint-box" id="hintBox"></div>
      <div class="helper-row">
        <button class="btn ghost" id="hintBtn">💡 Use Hint</button>
        <button class="btn primary" id="submitBtn" disabled>Submit Prompt →</button>
      </div>
    </div>
  `;

  const sourceZone = document.getElementById('sourceZone');
  const targetZone = document.getElementById('targetZone');
  const submitBtn = document.getElementById('submitBtn');

  function makeBlock(b, inTarget){
    const el = document.createElement('div');
    el.className = 'block' + (inTarget?' removable':'');
    el.draggable = true;
    el.innerHTML = `<span class="handle">⠿</span><span>${b.text}</span>`;
    el.dataset.text = b.text;
    el.addEventListener('dragstart', e=>{
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', b.text);
    });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    if(inTarget){
      el.addEventListener('click', ()=>{
        placed = placed.filter(x=>x.text!==b.text);
        state.totalMoves++;
        redraw();
      });
    }
    return el;
  }

  function redraw(){
    sourceZone.innerHTML='';
    targetZone.innerHTML='';
    allBlocks.filter(b=>!placed.find(p=>p.text===b.text)).forEach(b=> sourceZone.appendChild(makeBlock(b,false)));
    placed.forEach(b=> targetZone.appendChild(makeBlock(b,true)));
    submitBtn.disabled = placed.length===0;
    [sourceZone,targetZone].forEach(setupDropzone);
  }

  function setupDropzone(zone){
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('dragover'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      const text = e.dataTransfer.getData('text/plain');
      const block = allBlocks.find(b=>b.text===text);
      if(!block) return;
      if(zone===targetZone){
        if(!placed.find(p=>p.text===text)){
          placed.push(block);
          state.totalMoves++;
          if(!block.correct){
            wrongThisScenario++;
            state.wrongPlacements++;
            toast('That block weakens the prompt ✕', 'bad');
          } else {
            toast('Good addition ✓', 'good');
          }
        }
      } else {
        placed = placed.filter(p=>p.text!==text);
      }
      redraw();
    });
  }
  redraw();

  document.getElementById('hintBtn').onclick = ()=>{
    if(hintUsed){ toast('Hint already used for this scenario','info'); return; }
    hintUsed = true;
    state.hintsUsed++;
    document.getElementById('hintBox').textContent = `💡 Principle: ${sc.principle}`;
  };

  submitBtn.onclick = ()=>{
    const correctPlaced = placed.filter(p=>p.correct).length;
    const incorrectPlaced = placed.filter(p=>!p.correct).length;
    const accuracy = Math.round((correctPlaced / sc.correctBlocks.length) * 100 - incorrectPlaced*10);
    const clamped = Math.max(0, Math.min(100, accuracy));
    const optBonus = (incorrectPlaced===0 && correctPlaced===sc.correctBlocks.length) ? 15 : 0;
    state.optimizationBonus += optBonus;
    if(correctPlaced===sc.correctBlocks.length && incorrectPlaced===0) state.correctAnswers++;
    finishScenario(sc, clamped, optBonus, hintUsed, wrongThisScenario);
  };
}

/* =====================================================================
   CHALLENGE 2 — CLEAN THE PROMPT (remove distractors from a mixed prompt)
   ===================================================================== */
function renderClean(sc){
  const items = shuffle([
    ...sc.correctBlocks.map(t=>({text:t, correct:true})),
    ...sc.distractorBlocks.map(t=>({text:t, correct:false}))
  ]);
  let picked = new Set(); // items marked for removal
  let hintUsed = false;

  app.innerHTML = `
    <div class="panel">
      ${scenarioHeader(sc,'Clean the Prompt')}
      <p class="lead">This prompt draft is cluttered with weak or harmful lines. Click each line that should be <b>removed</b>, then submit your cleaned prompt.</p>
      <div class="zone-title">Prompt Draft</div>
      <div class="clean-list" id="cleanList"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="helper-row">
        <button class="btn ghost" id="hintBtn">💡 Use Hint</button>
        <button class="btn primary" id="submitBtn">Submit Cleaned Prompt →</button>
      </div>
    </div>
  `;
  const list = document.getElementById('cleanList');
  function redraw(){
    list.innerHTML='';
    items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'clean-item' + (picked.has(it.text)?' picked':'');
      row.innerHTML = `<span class="cb">${picked.has(it.text)?'✕':''}</span><span>${it.text}</span>`;
      row.onclick = ()=>{
        state.totalMoves++;
        if(picked.has(it.text)) picked.delete(it.text); else picked.add(it.text);
        redraw();
      };
      list.appendChild(row);
    });
  }
  redraw();

  document.getElementById('hintBtn').onclick = ()=>{
    if(hintUsed){ toast('Hint already used for this scenario','info'); return; }
    hintUsed = true;
    state.hintsUsed++;
    document.getElementById('hintBox').textContent = `💡 Principle: ${sc.principle}`;
  };

  document.getElementById('submitBtn').onclick = ()=>{
    let correctRemovals=0, wrongRemovals=0, missedRemovals=0;
    items.forEach(it=>{
      const wasPicked = picked.has(it.text);
      if(!it.correct && wasPicked) correctRemovals++;
      else if(it.correct && wasPicked){ wrongRemovals++; state.wrongPlacements++; }
      else if(!it.correct && !wasPicked) missedRemovals++;
    });
    const total = sc.distractorBlocks.length;
    const accuracy = Math.round(((correctRemovals - wrongRemovals) / total) * 100);
    const clamped = Math.max(0, Math.min(100, accuracy));
    const perfect = correctRemovals===total && wrongRemovals===0;
    const optBonus = perfect ? 15 : 0;
    state.optimizationBonus += optBonus;
    if(perfect) state.correctAnswers++;
    finishScenario(sc, clamped, optBonus, hintUsed, wrongRemovals+missedRemovals);
  };
}

/* =====================================================================
   CHALLENGE 3 — CHOOSE THE BEST PROMPT
   ===================================================================== */
function renderChoose(sc){
  const options = shuffle([
    {kind:'weak', text:sc.weakPrompt},
    {kind:'optimized', text:sc.optimizedPrompt},
    {kind:'over', text:sc.overEngineeredPrompt}
  ]);
  let hintUsed = false;
  let answered = false;

  app.innerHTML = `
    <div class="panel">
      ${scenarioHeader(sc,'Choose the Best Prompt')}
      <p class="lead">Three prompt candidates were written for this task. Pick the one most likely to reliably produce the desired output — not too vague, not bloated.</p>
      <div id="choiceList"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="helper-row">
        <button class="btn ghost" id="hintBtn">💡 Use Hint</button>
        <div></div>
      </div>
    </div>
  `;
  const listEl = document.getElementById('choiceList');
  options.forEach(opt=>{
    const card = document.createElement('div');
    card.className = 'choice-card';
    const label = opt.kind==='weak' ? 'Candidate' : opt.kind==='optimized' ? 'Candidate' : 'Candidate';
    card.innerHTML = `<b>${label}</b><p>${opt.text}</p>`;
    card.onclick = ()=>{
      if(answered) return;
      answered = true;
      state.totalMoves++;
      document.querySelectorAll('.choice-card').forEach(c=>c.classList.add('disabled'));
      let accuracy, optBonus=0;
      if(opt.kind==='optimized'){
        card.classList.add('correct');
        accuracy = 100;
        optBonus = 15;
        toast('Optimal choice ✓ — clear, complete, not bloated', 'good');
        state.correctAnswers++;
      } else {
        card.classList.add('wrong');
        state.wrongPlacements++;
        accuracy = opt.kind==='weak' ? 30 : 55;
        toast(opt.kind==='weak' ? 'Too vague — missing role, format, constraints' : 'Over-engineered — bloated & unfocused', 'bad');
        // reveal the correct one
        [...listEl.children].forEach((c,i)=>{
          if(options[i].kind==='optimized') c.classList.add('correct');
        });
      }
      state.optimizationBonus += optBonus;
      setTimeout(()=> finishScenario(sc, accuracy, optBonus, hintUsed, opt.kind==='optimized'?0:1), 900);
    };
    listEl.appendChild(card);
  });

  document.getElementById('hintBtn').onclick = ()=>{
    if(hintUsed){ toast('Hint already used for this scenario','info'); return; }
    hintUsed = true;
    state.hintsUsed++;
    document.getElementById('hintBox').textContent = `💡 Principle: ${sc.principle}`;
  };
}

/* =====================================================================
   FINISH A SCENARIO -> show compare panel, then advance
   ===================================================================== */
function finishScenario(sc, accuracy, optBonus, hintUsed, wrongCount){
  const timeSpent = Math.round((Date.now()-state.scenarioStart)/1000);
  state.perScenario.push({
    id:sc.id, title:sc.title, type:sc.challengeType, accuracy, optBonus, hintUsed, wrongCount, timeSpent
  });

  const rect = document.body.getBoundingClientRect();
  scorePop(window.innerWidth/2, 100, `+${accuracy + optBonus} pts`);

  app.innerHTML = `
    <div class="panel">
      <span class="tag ${sc.challengeType}">Result</span>
      <h1 style="margin-top:10px;">${sc.title}</h1>
      <div class="metric-list" style="grid-template-columns:repeat(3,1fr);">
        <div class="metric"><span>Accuracy</span><b>${accuracy}%</b></div>
        <div class="metric"><span>Opt. Bonus</span><b>${optBonus>0?'+':''}${optBonus}</b></div>
        <div class="metric"><span>Time</span><b>${formatTime(timeSpent)}</b></div>
      </div>
      <div class="compare-grid">
        <div class="compare-card weak">
          <h4>⚠ Weak Prompt</h4>
          <p style="font-family:var(--mono);color:var(--text);">"${sc.weakPrompt}"</p>
          <p style="margin-top:8px;">${sc.weakOutput}</p>
        </div>
        <div class="compare-card opt">
          <h4>✓ Optimized Prompt</h4>
          <p style="font-family:var(--mono);color:var(--text);">"${sc.optimizedPrompt}"</p>
          <p style="margin-top:8px;">${sc.optimizedOutput}</p>
        </div>
      </div>
      <div class="principle-strip">💡 <b>Prompt Principle:</b> ${sc.principle}</div>
      <div class="btn-row">
        <button class="btn primary" id="nextBtn">${state.index+1 < state.scenarios.length ? 'Next Scenario →' : 'See Final Report →'}</button>
      </div>
    </div>
  `;
  document.getElementById('nextBtn').onclick = ()=>{
    state.index++;
    renderScenario();
  };
}

/* =====================================================================
   FINAL REPORT
   ===================================================================== */
function renderReport(){
  state.finished = true;
  topStats.innerHTML = '';
  const totalTime = Math.round((Date.now()-state.startTime)/1000);
  const n = state.perScenario.length;
  const avgAccuracy = Math.round(state.perScenario.reduce((s,p)=>s+p.accuracy,0)/n);
  const promptScore = Math.max(0, Math.round(
    avgAccuracy*0.55 +
    state.optimizationBonus*0.9 -
    state.wrongPlacements*3 -
    state.hintsUsed*4 +
    Math.max(0, 40 - Math.floor(totalTime/6))
  ));
  const clampedScore = Math.max(0, Math.min(100, promptScore));

  let rating, rank, rankColor;
  if(clampedScore>=90){rating='Exceptional';rank='🏆 Prompt Architect';}
  else if(clampedScore>=75){rating='Strong';rank='🥈 Precision Engineer';}
  else if(clampedScore>=55){rating='Solid';rank='🥉 Capable Prompter';}
  else if(clampedScore>=35){rating='Developing';rank='🌱 Apprentice';}
  else {rating='Needs Practice';rank='🔰 Newcomer';}

  // Prompt DNA — derived pseudo-traits from performance
  const clarity = Math.max(5, Math.min(100, avgAccuracy));
  const constraint = Math.max(5, Math.min(100, 100 - state.wrongPlacements*8));
  const structure = Math.max(5, Math.min(100, avgAccuracy - state.hintsUsed*5 + 10));
  const efficiency = Math.max(5, Math.min(100, 100 - Math.floor(totalTime/n/2)));
  const optimization = Math.max(5, Math.min(100, Math.round((state.optimizationBonus / (n*15))*100)));

  const dna = [
    {label:'Clarity', val:clarity},
    {label:'Constraint Use', val:constraint},
    {label:'Structure', val:structure},
    {label:'Efficiency', val:efficiency},
    {label:'Optimization', val:optimization}
  ];

  const weakest = dna.slice().sort((a,b)=>a.val-b.val)[0];
  const bestScenario = state.scenarios[0];

  const milestoneMap = {
    'Clarity':'Practice stating the role, task, and format in one clear sentence before adding detail.',
    'Constraint Use':'Focus on adding one explicit constraint per prompt (scope, tone, length, or behavior boundary).',
    'Structure':'Try outlining desired output sections before writing the prompt itself.',
    'Efficiency':'Time-box each prompt draft to reduce over-thinking on straightforward tasks.',
    'Optimization':'Compare a weak and optimized version side-by-side before submitting your final prompt.'
  };

  const finalPrompt = state.scenarios[state.scenarios.length-1].optimizedPrompt;

  app.innerHTML = `
    <div class="panel">
      <div class="eyebrow">Prompt Performance Report</div>
      <h1>Session complete</h1>
      <p class="lead">${state.domain} · ${state.difficulty} · ${n} scenarios · ${formatTime(totalTime)}</p>

      <div class="report-grid" style="margin-top:20px;">
        <div>
          <div class="big-score">${clampedScore}</div>
          <div class="rank-badge">${rank}</div>
          <p style="margin-top:10px;color:var(--text-dim);">Rating: <b style="color:var(--text);">${rating}</b></p>

          <div class="metric-list">
            <div class="metric"><span>Avg Accuracy</span><b>${avgAccuracy}%</b></div>
            <div class="metric"><span>Total Moves</span><b>${state.totalMoves}</b></div>
            <div class="metric"><span>Wrong Placements</span><b>${state.wrongPlacements}</b></div>
            <div class="metric"><span>Hints Used</span><b>${state.hintsUsed}</b></div>
            <div class="metric"><span>Opt. Bonus</span><b>+${state.optimizationBonus}</b></div>
            <div class="metric"><span>Total Time</span><b>${formatTime(totalTime)}</b></div>
          </div>

          <div class="feedback-box">
            <b>Personalized feedback:</b> You performed best on structured tasks and scored a ${rating.toLowerCase()} overall accuracy of ${avgAccuracy}%.
            ${state.wrongPlacements>3 ? ' Watch for distractor blocks that sound plausible but add scope creep or vague instructions.' : ' Your placements were largely precise, showing good judgement on what belongs in a prompt.'}
            ${state.hintsUsed>2 ? ' Leaning on hints often suggests reviewing core prompting principles before your next run.' : ' Low hint usage shows growing independence in spotting strong prompt structure.'}
          </div>

          <div class="milestone-box">
            <b>🎯 Next milestone:</b> Strengthen <b>${weakest.label}</b> — ${milestoneMap[weakest.label]}
          </div>
        </div>

        <div>
          <h2 style="font-size:15px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;">Prompt DNA</h2>
          <div class="dna-wrap">
            ${dna.map(d=>`
              <div class="dna-row">
                <div class="dna-label">${d.label}</div>
                <div class="dna-bar-track"><div class="dna-bar-fill" style="width:${d.val}%"></div></div>
                <div class="dna-val">${d.val}</div>
              </div>
            `).join('')}
          </div>

          <h2 style="font-size:15px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-top:22px;">Final Optimized Prompt</h2>
          <div class="final-prompt">${finalPrompt}</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn primary" id="replayBtn">🔁 Replay with New Scenarios</button>
        <button class="btn ghost" id="newSetupBtn">⚙ Change Domain / Difficulty</button>
      </div>
    </div>
  `;

  document.getElementById('replayBtn').onclick = ()=>{
    state = freshState(state.domain, state.difficulty);
    toast('New scenarios generated', 'good');
    renderScenario();
  };
  document.getElementById('newSetupBtn').onclick = renderSetup;
}

/* =====================================================================
   INIT
   ===================================================================== */
renderSetup();
})();
</script>
</body>
</html>
