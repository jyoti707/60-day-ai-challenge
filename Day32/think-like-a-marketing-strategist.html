<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0b0e14;
    --bg2:#11151f;
    --card:#161b26;
    --card2:#1c2331;
    --border:#2a3245;
    --text:#e8ecf5;
    --muted:#9aa5b8;
    --accent:#7c5cff;
    --accent2:#00d4b5;
    --warn:#ff8a5c;
    --danger:#ff5c7a;
    --good:#4ade80;
    --radius:16px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 10% -10%, #1a1f33 0%, transparent 60%),
                radial-gradient(1000px 700px at 100% 0%, #16202b 0%, transparent 55%),
                var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  .app{
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 18px 80px;
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:15px;
    color:var(--muted);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 12px var(--accent);
  }
  .progress-wrap{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .progress-dot{
    width:28px;height:6px;border-radius:4px;
    background:var(--border);
    transition: all .35s ease;
  }
  .progress-dot.active{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 10px rgba(124,92,255,0.6);
  }
  .progress-dot.done{
    background:var(--accent2);
    opacity:.6;
  }
  .card{
    background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom:20px;
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  h1{font-size:28px; margin:0 0 8px; letter-spacing:-0.02em;}
  h2{font-size:22px; margin:0 0 6px; letter-spacing:-0.01em;}
  h3{font-size:17px; margin:0 0 6px;}
  p{color:var(--muted); line-height:1.6; margin:0 0 12px;}
  .muted{color:var(--muted);}
  .pill{
    display:inline-block;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    background:rgba(124,92,255,0.15);
    color:#b9a9ff;
    border:1px solid rgba(124,92,255,0.3);
    margin-bottom:14px;
  }
  .grid{
    display:grid;
    gap:14px;
  }
  .grid-2{grid-template-columns: 1fr 1fr;}
  .grid-3{grid-template-columns: repeat(3,1fr);}
  @media (max-width:720px){
    .grid-2, .grid-3{grid-template-columns: 1fr;}
  }
  .option-card{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    cursor:pointer;
    transition: all .2s ease;
    text-align:left;
  }
  .option-card:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124,92,255,0.15);
  }
  .option-card.selected{
    border-color: var(--accent2);
    background: rgba(0,212,181,0.08);
    box-shadow: 0 0 0 1px var(--accent2);
  }
  .option-card .emoji{font-size:28px; margin-bottom:8px; display:block;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:12px;
    padding:12px 22px;
    font-size:15px;
    font-weight:600;
    transition: all .2s ease;
  }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent), #5b3dff);
    color:white;
    box-shadow: 0 6px 18px rgba(124,92,255,0.35);
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124,92,255,0.5);}
  .btn-primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .btn-secondary{
    background:var(--card2);
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn-secondary:hover{ border-color:var(--accent);}
  .btn-row{
    display:flex;
    gap:12px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .info-box{
    background: rgba(124,92,255,0.08);
    border:1px solid rgba(124,92,255,0.25);
    border-radius:12px;
    padding:14px 16px;
    margin:12px 0;
  }
  .info-box .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent2);
    font-weight:700;
    margin-bottom:4px;
  }
  .why-box{
    background: rgba(0,212,181,0.06);
    border-left:3px solid var(--accent2);
    border-radius:8px;
    padding:12px 14px;
    margin-top:10px;
    font-size:14px;
  }
  .why-box b{color:var(--accent2);}
  .claude-card{
    margin-top:16px;
    background: linear-gradient(135deg, rgba(124,92,255,0.1), rgba(0,212,181,0.06));
    border:1px dashed rgba(124,92,255,0.4);
    border-radius:14px;
    padding:16px 18px;
  }
  .claude-card .ctitle{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:13px;
    color:#b9a9ff;
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .claude-prompt{
    background:#0d1017;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size:13px;
    color:#d6e0ff;
    line-height:1.5;
    white-space:pre-wrap;
    position:relative;
  }
  .copy-btn{
    margin-top:8px;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
  }
  .copy-btn:hover{color:var(--text); border-color:var(--accent2);}
  .platform-card{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .platform-card.selected{
    border-color:var(--good);
    background:rgba(74,222,128,0.08);
  }
  .platform-card.selected::after{
    content:"✓ Selected";
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    color:var(--good);
    font-weight:700;
  }
  .fit-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .fit-high{background:rgba(74,222,128,0.15); color:var(--good);}
  .fit-med{background:rgba(255,138,92,0.15); color:var(--warn);}
  .fit-low{background:rgba(255,92,122,0.15); color:var(--danger);}
  .pillar-card{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
  }
  .pillar-card.selected{
    border-color:var(--accent);
    background:rgba(124,92,255,0.1);
  }
  .pillar-num{
    position:absolute;
    top:12px; right:14px;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .week-card{
    background:var(--card2);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
  }
  .week-tag{
    font-size:11px;
    font-weight:700;
    color:var(--accent2);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:6px;
  }
  .event-box{
    background: linear-gradient(135deg, rgba(255,138,92,0.12), rgba(255,92,122,0.08));
    border:1px solid rgba(255,138,92,0.3);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .response-option{
    display:block;
    width:100%;
    text-align:left;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    color:var(--text);
    font-weight:500;
  }
  .response-option:hover{border-color:var(--accent);}
  .response-option.chosen{
    border-color:var(--accent2);
    background:rgba(0,212,181,0.1);
  }
  .consequence-box{
    margin-top:14px;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(0,212,181,0.08);
    border:1px solid rgba(0,212,181,0.3);
    animation: fadeUp .4s ease;
  }
  .report-section{
    border-bottom:1px solid var(--border);
    padding:16px 0;
  }
  .report-section:last-child{border-bottom:none;}
  .report-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent2);
    margin-bottom:6px;
  }
  .lesson-item{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    align-items:flex-start;
  }
  .lesson-num{
    flex-shrink:0;
    width:26px;height:26px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:white;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .score-bar-bg{
    flex:1;
    height:10px;
    background:var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .score-bar-fill{
    height:100%;
    border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition: width 1s ease;
  }
  .badge-good{color:var(--good); font-weight:700;}
  .badge-warn{color:var(--warn); font-weight:700;}
  .badge-bad{color:var(--danger); font-weight:700;}
  textarea, input[type=text]{
    width:100%;
    background:#0d1017;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--accent);}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
    margin-top:14px;
  }
  .field-hint{font-size:12px; color:var(--muted); margin-top:4px;}
  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:30px;
  }
  .step-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:4px;
  }
  .count-chip{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--muted);
  }
  .count-chip.ok{color:var(--good); border-color:rgba(74,222,128,0.4);}
  a.link, .link{color:var(--accent2); text-decoration:none; cursor:pointer;}
</style>
</head>

<div id="root"></div>

];

function randomBusiness() {
  const pick = INDUSTRIES[Math.floor(Math.random() * INDUSTRIES.length)];
  const comp1 = COMPETITORS_POOL[Math.floor(Math.random() * COMPETITORS_POOL.length)];
  let comp2 = COMPETITORS_POOL[Math.floor(Math.random() * COMPETITORS_POOL.length)];
  while (comp2 === comp1) comp2 = COMPETITORS_POOL[Math.floor(Math.random() * COMPETITORS_POOL.length)];
  return {
    mode: "client",
    name: pick.name,
    industry: pick.name,
    audience: pick.audience,
    budget: pick.budget,
    challenge: pick.challenge,
    competitors: [comp1, comp2],
  };
}

function ProgressBar({ step, totalSteps }) {
  return (
    <div className="progress-wrap">
      {Array.from({ length: totalSteps }).map((_, i) => (
        <div
          key={i}
          className={"progress-dot " + (i === step ? "active" : i < step ? "done" : "")}
        />
      ))}
    </div>
  );
}

function ClaudeCard({ title, prompt }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    const ta = document.createElement("textarea");
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }
  return (
    <div className="claude-card">
      <div className="ctitle">🤖 How to ask Claude — {title}</div>
      <div className="claude-prompt">{prompt}</div>
      <button className="copy-btn" onClick={copy}>{copied ? "Copied!" : "Copy prompt"}</button>
    </div>
  );
}

function SectionHeader({ eyebrow, title, subtitle }) {
  return (
    <div>
      {eyebrow && <div className="pill">{eyebrow}</div>}
      <h2>{title}</h2>

}

  const [selected, setSelected] = useState([]);
  const [revealed, setRevealed] = useState(false);

    <div className="card">

        eyebrow="Step 3 of 6"

        {platforms.map(p => (
          <div
            key={p.key}
            className={"platform-card " + (selected.includes(p.key) ? "selected" : "")}

            <h3>{p.emoji} {p.label}</h3>

              <div className="why-box" style={{marginTop:8}}>

      <ClaudeCard
        title="Platform Strategy"
        prompt={isPersonal

          : `My business "${business.name}" sells to: ${business.audience}. Recommend the best 2-3 social media platforms for this brand, explain why each platform fits (or doesn't fit) this audience, and suggest one platform I should deprioritize and why.`}

        <button className="btn-primary" disabled={selected.length===0} onClick={()=>onContinue(selected)}>Continue to Content Pillars →</button>

/* ---------------------------- STEP 4: CONTENT PILLARS ---------------------------- */

function PillarsStep({ business, onContinue }) {
  const isPersonal = business.mode === "personal";
  const pillars = isPersonal ? PILLARS_PERSONAL : PILLARS_BUSINESS;
  const [selected, setSelected] = useState([]);

  function toggle(name) {
    setSelected(prev => {
      if (prev.includes(name)) return prev.filter(n=>n!==name);
      if (prev.length >= 3) return prev;
      return [...prev, name];
    });
  }

  return (
    <div className="card">
      <SectionHeader
        eyebrow="Step 4 of 6"
        title="Choose your 3 content pillars"
        subtitle="Content pillars are recurring themes that give your content direction. Trying to cover everything leads to inconsistent, unfocused content."
      />
      <div className="step-title-row">
        <span className="muted" style={{fontSize:13}}>Pick exactly 3</span>
        <span className={"count-chip " + (selected.length===3?"ok":"")}>{selected.length} / 3 selected</span>
      </div>
      <div className="grid grid-2">
        {pillars.map((p, i) => {
          const isSel = selected.includes(p.name);
          return (
            <div key={p.name} className={"pillar-card " + (isSel?"selected":"")} onClick={()=>toggle(p.name)}>
              {isSel && <div className="pillar-num">{selected.indexOf(p.name)+1}</div>}
              <h3>{p.name}</h3>
              <p style={{fontSize:14, marginBottom:6}}>{p.desc}</p>
              <div className="why-box" style={{marginTop:0}}><b>Supports:</b> {p.goal}</div>
            </div>
          );
        })}
      </div>
      <div className="why-box" style={{marginTop:16}}>
        <b>Why only 3?</b> Constraints force clarity. Three pillars are enough to stay varied, but few
        enough that your audience learns exactly what to expect from you.
      </div>
      <ClaudeCard
        title="Content Pillars"
        prompt={isPersonal
          ? `I'm ${business.name}, building a personal brand in "${business.industry}". I've chosen these 3 content pillars: ${selected.length?selected.join(", "):"[your 3 pillars]"}. Generate 5 specific post ideas for each pillar that reflect my real experience and would resonate with this audience: ${business.audience}.`
          : `My business "${business.name}" sells to ${business.audience}. I've chosen these 3 content pillars: ${selected.length?selected.join(", "):"[your 3 pillars]"}. Generate 5 specific content ideas for each pillar, tailored to this audience and appropriate for the platforms I'm using.`}
      />
      <div className="btn-row">
        <button className="btn-primary" disabled={selected.length!==3} onClick={()=>onContinue(selected)}>Build the 30-Day Roadmap →</button>
      </div>
    </div>
  );
}

/* ---------------------------- STEP 5: 30-DAY ROADMAP ---------------------------- */

function buildRoadmap(business, pillars) {
  const isPersonal = business.mode === "personal";
  if (isPersonal) {
    return [
      { tag: "Week 1 — Foundation", goal: "Define your point of view & optimize your profile/bio", strategy: `Clarify the specific angle you talk about within "${business.industry}", rewrite your bio to state who you help and how, and pin/introduce yourself with a founding story post.` },
      { tag: "Week 2 — Trust Building", goal: `Lean into "${pillars[0] || "your first pillar"}"`, strategy: "Publish consistently around your strongest pillar to establish what you're known for. Engage daily with 5-10 relevant accounts in your niche to build visibility." },
      { tag: "Week 3 — Value & Range", goal: `Introduce "${pillars[1] || "your second pillar"}"`, strategy: "Add your second pillar to show range while staying anchored to your niche. Start tracking which post formats get the most saves, replies, or shares." },
      { tag: "Week 4 — Depth & Community", goal: `Add "${pillars[2] || "your third pillar"}" & start converting`, strategy: "Introduce your third pillar, ask your audience direct questions to boost engagement, and add a clear call-to-action (like a newsletter signup) to turn followers into a real audience." },
    ];
  }
  return [
    { tag: "Week 1 — Foundation", goal: "Establish brand presence & visual consistency", strategy: `Set up or refresh profiles on chosen platforms, establish a consistent visual style, and publish an introductory post explaining who "${business.name}" is and who it's for.` },
    { tag: "Week 2 — Awareness", goal: `Lean into "${pillars[0] || "your first pillar"}"`, strategy: "Focus most content on your strongest pillar to build initial recognition. Track which posts get the most engagement to learn what resonates." },
    { tag: "Week 3 — Trust & Consideration", goal: `Introduce "${pillars[1] || "your second pillar"}"`, strategy: "Mix in your second pillar to build credibility and trust — this is where you address hesitations your audience might have about buying." },
    { tag: "Week 4 — Conversion & Community", goal: `Add "${pillars[2] || "your third pillar"}" & drive action`, strategy: "Introduce your third pillar, add a clear call-to-action (offer, signup, or purchase prompt), and start highlighting real customers to build social proof." },
  ];
}

function RoadmapStep({ business, pillars, onContinue }) {
  const roadmap = useMemo(()=>buildRoadmap(business, pillars), [business, pillars]);
  const isPersonal = business.mode === "personal";
  return (
    <div className="card">
      <SectionHeader
        eyebrow="Step 5 of 6"
        title="Your 30-Day Strategy Roadmap"
        subtitle="This isn't a list of individual posts — it's the weekly strategic focus that guides what you post."
      />
      {roadmap.map((w,i)=>(
        <div className="week-card" key={i}>
          <div className="week-tag">{w.tag}</div>
          <h3 style={{marginBottom:4}}>{w.goal}</h3>
          <p style={{marginBottom:0}}>{w.strategy}</p>
        </div>
      ))}
      <div className="why-box">
        <b>Why plan by week, not by post?</b> Strategy operates at the level of goals and themes.
        If you plan post-by-post first, you end up reacting instead of building momentum toward something.
      </div>
      <ClaudeCard
        title="30-Day Roadmap"
        prompt={isPersonal
          ? `I'm ${business.name}, building a personal brand in "${business.industry}" for this audience: ${business.audience}. My 3 content pillars are: ${pillars.join(", ")}. Turn this into a detailed 30-day content calendar with specific post topics for each day, starting with defining my POV and optimizing my bio in week 1.`
          : `My business "${business.name}" targets ${business.audience}. My 3 content pillars are: ${pillars.join(", ")}. Turn this into a detailed 30-day content calendar with specific post topics for each day, organized by the weekly strategic focus.`}
      />
      <div className="btn-row">
        <button className="btn-primary" onClick={onContinue}>Continue to the Unexpected Event →</button>
      </div>
    </div>
  );

/* ---------------------------- STEP 6: UNEXPECTED EVENT ---------------------------- */

function EventStep({ business, onContinue }) {
  const isPersonal = business.mode === "personal";
  const pool = isPersonal ? EVENTS_PERSONAL : EVENTS_BUSINESS;
  const [event] = useState(()=>pool[Math.floor(Math.random()*pool.length)]);
  const [chosenIdx, setChosenIdx] = useState(null);

  const chosen = chosenIdx !== null ? event.options[chosenIdx] : null;

  return (
    <div className="card">
      <SectionHeader eyebrow="Step 6 of 6" title="An unexpected event just happened" subtitle="Strategy isn't just planning — it's how you adapt when reality doesn't follow the plan." />
      <div className="event-box">
        <h3 style={{marginBottom:6}}>{event.title}</h3>
        <p style={{marginBottom:0}}>{event.desc}</p>
      </div>
      <div>
        {event.options.map((opt, i) => (
          <button
            key={i}
            className={"response-option " + (chosenIdx===i ? "chosen":"")}
            onClick={()=>setChosenIdx(i)}
          >
            {opt.label}
          </button>
        ))}
      </div>
      {chosen && (
        <div className="consequence-box">
          <b className={chosen.tone==="good"?"badge-good":chosen.tone==="bad"?"badge-bad":"badge-warn"}>
            {chosen.tone==="good"?"Strong Move: ":chosen.tone==="bad"?"Risky Move: ":"Mixed Result: "}
          </b>
          {chosen.outcome}
        </div>
      )}
      <div className="why-box" style={{marginTop:16}}>
        <b>Why does this matter?</b> Plans give you direction, but real audiences are unpredictable.
        The strategists who grow fastest are the ones who can respond to surprises without abandoning their strategy.
      </div>
      <ClaudeCard
        title="Reacting to the Unexpected"
        prompt={isPersonal
          ? `I'm ${business.name} in the "${business.industry}" niche. This just happened: "${event.desc}" I'm considering this response: "${chosen ? chosen.label : "[your chosen response]"}". Help me draft the actual post or message I should publish in reaction to this, keeping my voice authentic and my niche credibility intact.`
          : `My business "${business.name}" just experienced this: "${event.desc}" I'm considering this response: "${chosen ? chosen.label : "[your chosen response]"}". Help me draft the actual post or public statement to publish, and flag any risks I should be aware of before posting.`}
      />
      <div className="btn-row">
        <button className="btn-primary" disabled={chosenIdx===null} onClick={()=>onContinue(event, chosen)}>See My Growth Report →</button>
      </div>
    </div>
  );
}

/* ---------------------------- FINAL: GROWTH REPORT ---------------------------- */

function scoreFromChoices(platforms, pillars, chosenTone) {
  let score = 50;
  score += Math.min(platforms.length, 3) * 6;
  if (platforms.length > 4) score -= 8;
  score += pillars.length === 3 ? 10 : 0;
  if (chosenTone === "good") score += 20;
  if (chosenTone === "mixed") score += 8;
  if (chosenTone === "bad") score -= 10;
  return Math.max(15, Math.min(98, score));
}

function GrowthReport({ business, platforms, pillars, event, chosen, onRestart }) {
  const isPersonal = business.mode === "personal";
  const score = scoreFromChoices(platforms, pillars, chosen.tone);
  const platformLabels = (isPersonal ? PLATFORM_DATA.personal : PLATFORM_DATA.business)
    .filter(p=>platforms.includes(p.key)).map(p=>p.label).join(", ");

  const lessonsPersonal = [
    "Authenticity beats polish — audiences follow real people, not perfect brands.",
    "Consistency compounds — showing up on a clear schedule builds trust faster than sporadic viral hits.",
    "Niche clarity attracts the right people faster than trying to appeal to everyone.",
  ];
  const lessonsBusiness = [
    "Every platform choice should map back to where your specific audience already spends time.",
    "Content pillars work best when they're few, focused, and tied to a real business goal.",
    "How you respond to the unexpected often matters more to long-term trust than the plan itself.",
  ];

  const bestDecision = pillars.length === 3
    ? `Choosing exactly 3 focused content pillars (${pillars.join(", ")}) instead of trying to cover everything.`
    : "Engaging thoughtfully with each step of the strategy process instead of rushing.";
  const biggestMistake = chosen.tone === "bad"
    ? `Your response to the unexpected event ("${chosen.label}") carried real risk — ${chosen.outcome}`
    : platforms.length > 4
      ? "Spreading focus across too many platforms at once, which can dilute consistency."
      : "No major mistakes — the main opportunity now is turning this plan into consistent execution.";

  return (
    <div className="card">
      <SectionHeader eyebrow="Final Report" title="📊 Your Growth Report" subtitle={`Strategy summary for ${business.name}`} />

      <div className="score-row">
        <b style={{whiteSpace:"nowrap"}}>Growth Potential</b>
        <div className="score-bar-bg"><div className="score-bar-fill" style={{width: score+"%"}}></div></div>
        <b style={{color:"var(--accent2)"}}>{score}/100</b>
      </div>

      <div className="report-section">
        <div className="report-label">Audience Understanding</div>
        <p style={{marginBottom:0}}>{isPersonal
          ? `You defined your niche as "${business.industry}" for an audience of ${business.audience}. This clarity is the foundation everything else was built on.`
          : `You identified ${business.audience} as your core audience, up against ${business.competitors.join(", ")}, with the challenge of "${business.challenge}".`}</p>
      </div>

      <div className="report-section">
        <div className="report-label">Platform Strategy</div>
        <p style={{marginBottom:0}}>You focused on: <b>{platformLabels || "no platforms selected"}</b>. {platforms.length<=3 ? "This is a focused, sustainable choice." : "This is a broad spread — consider narrowing focus for consistency."}</p>
      </div>

      <div className="report-section">
        <div className="report-label">Content Strategy</div>
        <p style={{marginBottom:0}}>Your 3 pillars — <b>{pillars.join(", ")}</b> — give your audience a clear, repeatable reason to keep following you.</p>
      </div>

      <div className="report-section">
        <div className="report-label">Growth Potential</div>
        <p style={{marginBottom:0}}>Based on your platform focus, pillar clarity, and your reaction to "{event.title}", your simulated growth potential is <b>{score}/100</b>.</p>
      </div>

      <div className="report-section">
        <div className="report-label">Best Decision</div>
        <p style={{marginBottom:0}}>{bestDecision}</p>
      </div>

      <div className="report-section">
        <div className="report-label">Biggest Mistake / Risk</div>
        <p style={{marginBottom:0}}>{biggestMistake}</p>
      </div>

      <div className="report-section">
        <div className="report-label">Three Marketing Lessons</div>
        {(isPersonal ? lessonsPersonal : lessonsBusiness).map((l,i)=>(
          <div className="lesson-item" key={i}>
            <div className="lesson-num">{i+1}</div>
            <p style={{marginBottom:0}}>{l}</p>
          </div>
        ))}
      </div>

      <ClaudeCard
        title="Full Strategy Recap"
        prompt={isPersonal
          ? `Act as a personal branding strategist. Review this plan for ${business.name} in the "${business.industry}" niche: platforms = ${platformLabels}; content pillars = ${pillars.join(", ")}; audience = ${business.audience}. Critique this strategy, point out any gaps, and suggest one bold move I'm not currently considering.`
          : `Act as a marketing strategist. Review this plan for "${business.name}": platforms = ${platformLabels}; content pillars = ${pillars.join(", ")}; audience = ${business.audience}; challenge = ${business.challenge}. Critique this strategy, point out any gaps, and suggest one bold move I'm not currently considering.`}
      />

      <div className="btn-row">
        <button className="btn-primary" onClick={onRestart}>🔁 Try a New Brand</button>
      </div>
    </div>
  );
}

/* ---------------------------- APP ROOT ---------------------------- */

const STEP = {
  WELCOME: 0,
  CHOOSE: 1,
  FORM: 2,
  UNDERSTAND: 3,
  PLATFORMS: 4,
  PILLARS: 5,
  ROADMAP: 6,
  EVENT: 7,
  REPORT: 8,
};

function App() {
  const [step, setStep] = useState(STEP.WELCOME);
  const [mode, setMode] = useState(null); // business | personal | client
  const [business, setBusiness] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [eventData, setEventData] = useState(null);
  const [chosenResponse, setChosenResponse] = useState(null);

  function restart() {
    setStep(STEP.WELCOME);
    setMode(null);
    setBusiness(null);
    setPlatforms([]);
    setPillars([]);
    setEventData(null);
    setChosenResponse(null);
  }

  function handleBrandChoice(key) {
    setMode(key);
    if (key === "client") {
      setBusiness(randomBusiness());
      setStep(STEP.FORM); // will show ClientReveal
    } else {
      setStep(STEP.FORM);
    }
  }

  const totalSteps = 7; // visual progress: choose, understand, platforms, pillars, roadmap, event, report

  function progressIndex() {
    switch(step) {
      case STEP.WELCOME: return 0;
      case STEP.CHOOSE: return 0;
      case STEP.FORM: return 0;
      case STEP.UNDERSTAND: return 1;
      case STEP.PLATFORMS: return 2;
      case STEP.PILLARS: return 3;
      case STEP.ROADMAP: return 4;
      case STEP.EVENT: return 5;
      case STEP.REPORT: return 6;
      default: return 0;
    }
  }

  return (
    <div className="app">
      <div className="header">
        <div className="brand"><span className="dot"></span> Marketing Strategist Simulator</div>
        {step !== STEP.WELCOME && <ProgressBar step={progressIndex()} totalSteps={totalSteps} />}
      </div>

      {step === STEP.WELCOME && <Welcome onStart={()=>setStep(STEP.CHOOSE)} />}

      {step === STEP.CHOOSE && <ChooseBrand onSelect={handleBrandChoice} />}

      {step === STEP.FORM && mode === "business" && (
        <BusinessForm onSubmit={(b)=>{ setBusiness(b); setStep(STEP.UNDERSTAND); }} />
      )}
      {step === STEP.FORM && mode === "personal" && (
        <PersonalForm onSubmit={(b)=>{ setBusiness(b); setStep(STEP.UNDERSTAND); }} />
      )}
      {step === STEP.FORM && mode === "client" && business && (
        <ClientReveal business={business} onContinue={()=>setStep(STEP.UNDERSTAND)} />
      )}

      {step === STEP.UNDERSTAND && business && (
        <UnderstandBrand business={business} onContinue={()=>setStep(STEP.PLATFORMS)} />
      )}

      {step === STEP.PLATFORMS && business && (
        <PlatformStep business={business} onContinue={(sel)=>{ setPlatforms(sel); setStep(STEP.PILLARS); }} />
      )}

      {step === STEP.PILLARS && business && (
        <PillarsStep business={business} onContinue={(sel)=>{ setPillars(sel); setStep(STEP.ROADMAP); }} />
      )}

      {step === STEP.ROADMAP && business && (
        <RoadmapStep business={business} pillars={pillars} onContinue={()=>setStep(STEP.EVENT)} />
      )}

      {step === STEP.EVENT && business && (
        <EventStep business={business} onContinue={(ev, chosen)=>{ setEventData(ev); setChosenResponse(chosen); setStep(STEP.REPORT); }} />
      )}

      {step === STEP.REPORT && business && eventData && chosenResponse && (
        <GrowthReport
          business={business}
          platforms={platforms}
          pillars={pillars}
          event={eventData}
          chosen={chosenResponse}
          onRestart={restart}
        />
      )}

      <div className="footer-note">Built to teach marketing thinking — every choice here maps to a real strategic principle.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
